# Roteiro project configuration (ADR-0007).

[ingest]
# The only audio in this repository is the synthesised test fixtures under
# `crates/rto-graph/tests/fixtures/audio/` — tones, silence and a speech-*shaped*
# signal, none of which contain spoken words. An ASR model asked to transcribe
# them does not return nothing; it returns fluent invented prose (a 500 Hz tone
# yields "I think it's a good idea" on a loop, digital silence yields a lecture on
# world government). That text would be stored as a *derived* fact and would then
# rank in `roteiro search`, so on a machine with the model installed, dogfooding
# `sync` over this repo embeds pure fabrication into its own graph.
#
# `[ingest]` toggles are all-or-nothing per content class — there is no per-path
# exclusion — so the honest setting for *this* repository is off. A project whose
# audio is real speech should leave it on (the default).
audio = false

[debt]
# Paths excluded from the intent-debt scan. These carry the debt *vocabulary* as
# content, not as real code debt: planning docs record postponed work by design
# (the Build Plan/ADRs), while changelogs, the website, and Cargo manifests name
# the marker categories in prose. Code debt is what `roteiro debt` should surface.
#
# This list is *additive* across layers: these patterns are appended to whatever
# `~/.roteiro/config.toml` sets rather than replacing it (ADR-0007 v1.1), and
# `roteiro config` prints each pattern with the layer it came from. To inherit
# nothing, add `ignore_reset = true` — deliberately all-or-nothing, so it cannot
# half-apply the way a mistyped `!pattern` negation silently would.
ignore = ["docs/**", "website/**", "**/CHANGELOG.md", "**/Cargo.toml"]

# [media]
# The pre-generation gate `roteiro media build` applies before loading a model
# (ADR-0015). It refuses blobs with nothing to read — digital silence, flat-colour
# images — and records *why*, with the value it measured, so a skip shows up in
# `media status` instead of being an indistinguishable hole.
#
# Left at its defaults here. They sit at the digital noise floor, because a false
# skip is a silently missing description and that is worse than a false pass now
# that generated output is clearly labelled. Quiet speech, room tone and subtly-
# textured images all pass, and still confabulate: the gate raises the floor, it
# does not fix the label.
#
# gate = true             # false sends every blob to the model
# silence_rms = 0.0001    # RMS amplitude, full scale 1.0 (≈ -80 dBFS). WAV only —
#                         # MP3/FLAC are not measured and always pass.
# image_variance = 0.00001  # luma variance, a pixel being 0.0..1.0
