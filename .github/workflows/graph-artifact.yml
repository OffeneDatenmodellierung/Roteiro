name: Graph artifact

# On merge to `main`, publish the content-addressed graph artifact so the merged
# graph is the canonical source (ADR-0001): a clone can fetch a ready-made graph
# instead of rebuilding. The asset is attached to a rolling `graph-latest`
# pre-release; its download URL is stable
# (…/releases/download/graph-latest/roteiro-graph.json) while the asset is
# replaced on each merge. `roteiro load` verifies the artifact's tree matches the
# checkout before installing it, so a stale asset is refused (the caller rebuilds).
on:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write # create/update the release

jobs:
  publish:
    name: Publish graph artifact
    if: github.repository == 'OffeneDatenmodellierung/Roteiro'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Export the graph
        run: cargo run --quiet --package roteiro -- export --out roteiro-graph.json
      - name: Publish to the graph-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the release each run so its tag/target tracks the merged
          # commit (a plain upload would leave the release pointing at the first
          # commit while the asset moves — misleading metadata). Deleting the tag
          # too keeps them in step. The download URL (…/graph-latest/…) is stable.
          gh release delete graph-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create graph-latest roteiro-graph.json \
            --title "Latest graph artifact" \
            --notes "Rolling content-addressed graph for \`main\`, rebuilt on each merge (target: ${GITHUB_SHA}). Fetch with: curl -fsSL <this asset URL> | roteiro load -" \
            --prerelease \
            --target "${GITHUB_SHA}"
