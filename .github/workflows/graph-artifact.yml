name: Graph artifact

# On merge to `main`, publish the merged graph's build-outputs so the graph is
# the canonical source (ADR-0001) and downloadable without a local build:
#   - `roteiro-graph.json` — the content-addressed graph a clone can `roteiro
#     load` instead of rebuilding.
#   - `roteiro-vault.zip` — the rendered Obsidian vault (dogfood): unzip and open
#     as an Obsidian vault to browse Roteiro's own knowledge base.
# Both attach to a rolling `graph-latest` pre-release with stable download URLs
# (…/releases/download/graph-latest/<asset>) while the assets are replaced on each
# merge. `roteiro load` verifies the graph's tree matches the checkout before
# installing it, so a stale asset is refused (the caller rebuilds).
on:
  push:
    # Every merge to main changes the HEAD tree, and the artifact is verified
    # against that tree on load — so republish on *any* change (a docs-only merge
    # still moves the tree, and a stale asset would be refused, defeating the fast
    # path). Not path-filtered on purpose.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create/update the release

# Serialise on the branch and cancel superseded runs, so two close-together
# merges can't race and leave `graph-latest` pointing at the older artifact.
#
# `cancel-in-progress: true` here is UNCONDITIONAL, and deliberately unlike
# `ci.yml` and `website.yml`, which scope it to `${{ github.event_name ==
# 'pull_request' }}` so that a `push` to `main` is never discarded. The reason
# they differ: those two produce a *verdict*, and cancelling a push-triggered run
# destroys the record that a merged commit was green. This workflow produces an
# *artifact*, where latest-wins is the correct semantic — an older run finishing
# after a newer one is precisely the race the group exists to prevent, so
# cancelling the superseded push is the point rather than a cost.
concurrency:
  group: graph-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish graph artifact
    if: github.repository == 'OffeneDatenmodellierung/Roteiro'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # A failed run must still save its cache; see the `checks` job in `ci.yml`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Export the graph
        run: cargo run --quiet --package roteiro -- export --out roteiro-graph.json
      - name: Render the Obsidian vault
        # A build-output of the same graph (`roteiro render obsidian`), published
        # alongside the graph so anyone can download and open Roteiro's own
        # knowledge base in Obsidian without a local build. `render obsidian`
        # syncs the graph itself, so no separate sync step is needed.
        run: |
          cargo run --quiet --package roteiro -- render obsidian --out vault
          (cd vault && zip -qr ../roteiro-vault.zip .)
      - name: Publish to the graph-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the release each run so its tag/target tracks the merged
          # commit (a plain upload would leave the release pointing at the first
          # commit while the asset moves — misleading metadata). Deleting the tag
          # too keeps them in step. The download URLs (…/graph-latest/…) are stable.
          gh release delete graph-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create graph-latest roteiro-graph.json roteiro-vault.zip \
            --title "Latest graph artifact" \
            --notes "Rolling build-outputs of the \`main\` graph, rebuilt on each merge (target: ${GITHUB_SHA}).
          - \`roteiro-graph.json\` — the content-addressed graph. Fetch with: \`curl -fsSL <asset URL> | roteiro load -\`.
          - \`roteiro-vault.zip\` — the rendered Obsidian vault; unzip and open the folder as an Obsidian vault." \
            --prerelease \
            --target "${GITHUB_SHA}"
