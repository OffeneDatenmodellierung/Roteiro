name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run, but only when nobody wants its result.
#
# `cancel-in-progress` is an expression, not `true`, and the distinction is the
# whole point:
#
# - `pull_request` -> CANCEL. A new push to a PR makes the previous run's
#   verdict worthless. Four of twelve in-flight runs were once found to be for
#   already-merged PRs, two of them `in_progress` for 151 and 167 minutes,
#   holding runners rather than merely queued.
# - `push` to `main` -> KEEP. These runs are the record that a merged commit was
#   green. A cancelled run leaves no such record, and cancelling it to save a
#   runner trades the evidence for the change. `release-plz.yml` sets `false`
#   for the same reason.
# - `workflow_dispatch` -> KEEP. Somebody asked for this run by hand.
#
# On the branch-protection interaction, which is load-bearing now that `checks`,
# `default-features` and `msrv` are required checks: a cancelled job reports
# `status=completed, conclusion=cancelled`, which is terminal and is NOT a
# success, so it does not satisfy a required check. That is safe here only
# because a cancellation is always *caused by* a superseding run in the same
# group, and the last run in any such chain is by definition not cancelled — it
# completes and reports on what is then the PR's head commit, which is the only
# commit branch protection evaluates. The stale `cancelled` results are left
# behind on commits that are no longer the head.
#
# The consequence to respect: never cancel a run without a successor to report
# in its place. That is why this is scoped to the event type and not to, say, a
# schedule or a manual sweep.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Is this run a release-plz version-bump PR?
  #
  # release-plz opens a PR whose entire diff is version fields and changelog
  # prose — for v1.25.0 (#479) exactly five files: `Cargo.toml`, `Cargo.lock`
  # and three `CHANGELOG.md`, 9 lines changed in each manifest and pure
  # additions in the changelogs. Building the full matrix for that cost 888
  # job-seconds on the `pull_request` event alone (checks 240s, coverage 452s,
  # default-features 145s, msrv 51s). And it recurs: release-plz opens a NEW PR
  # on a NEW timestamped branch every time `main` moves and closes the previous
  # one — three in eight minutes on 2026-08-19 — each firing the whole matrix.
  #
  # THE CONSTRAINT THAT SHAPES EVERYTHING BELOW. `main` requires the status
  # checks `checks`, `default-features` and `msrv`. Per GitHub's documentation,
  # a workflow skipped by path, branch or commit-message filtering leaves its
  # "associated checks ... in a 'Pending' state" and "a pull request that
  # requires those checks to be successful will be blocked from merging". So a
  # workflow-level `paths-ignore`/`branches-ignore` here would not save runner
  # time, it would make every future release PR permanently unmergeable without
  # an admin bypass, with nothing showing red to explain why. That is the same
  # trap that disqualified `website.yml`'s path-filtered jobs from being
  # required checks. Do not reach for a workflow-level filter.
  #
  # A job-level `if:` would in fact be safe — GitHub documents that "a job that
  # is skipped will report its status as 'Success'. It will not prevent a pull
  # request from merging, even if it is a required check", and lists `skipped`
  # among the successful check statuses alongside `success` and `neutral`. That
  # was checked rather than assumed, precisely because the failure mode is
  # permanent.
  #
  # The jobs that ARE required checks nonetheless RUN on a release PR, and skip
  # at the STEP level, for a reason that is not timidity about the above:
  # skipping the whole job would mean verifying nothing, and a version bump is
  # not a no-op. It can desynchronise `Cargo.lock` from the manifests, and it
  # can move a `version =` constraint on a workspace path dependency ahead of
  # the member it points at. release-plz rewrites the workspace `version` AND
  # the pinned `version =` on all eight path dependencies in `Cargo.toml`, so
  # that shape is not hypothetical. `cargo metadata --locked` catches both in
  # well under a second without compiling anything, and it can only run if the
  # job runs.
  #
  # That check is not guarded by `RELEASE_PR`: it runs on every PR and on every
  # push to `main` too (#871). Guarded, it never ran where #849's inconsistent
  # lock actually landed. It catches the window between an inconsistent merge
  # and the next lock regeneration; a duplicate that resolves consistently is
  # `deny.toml`'s `multiple-versions` baseline's job, not this one.
  #
  # WHICH jobs those are is deliberately not written down here. That is a fact
  # about branch protection rather than about this file, and a count in prose
  # beside a set the file itself defines goes stale in silence: this sentence
  # said "these three jobs" for a while after there were four, which is the
  # same rot one level down from the defect #494 is about.
  # `crates/roteiro/tests/ci_release_pr_parity.rs` holds the list, names branch
  # protection as its source and says how to re-read it, and fails if a
  # required job loses either arm or if a job appears here that nobody
  # classified as required or not. Add a job below and that test will tell you
  # what it needs.
  #
  # Both halves were confirmed by injecting them into this workspace:
  #   - workspace `version` bumped, `Cargo.lock` left behind
  #     -> "cannot update the lock file ... because --locked was passed", exit 101
  #   - `rto-exec`'s path-dependency constraint moved to 1.26.0, member at 1.25.0
  #     -> "failed to select a version for the requirement `rto-exec = ^1.26.0`",
  #        exit 101
  #
  # So the required contexts are satisfied by a genuine `success` from a job
  # that actually verified something, rather than by `skipped`-counts-as-success
  # semantics. The premium is roughly ten seconds of runner setup per job.
  #
  # What is deliberately NOT re-verified, and why it is proportionate: the
  # compile-and-test steps below cannot be affected by changelog prose, and
  # `roteiro.toml` already excludes `**/CHANGELOG.md` and `**/Cargo.toml` from
  # the debt scan that `roteiro check` runs — the project's own gate declares
  # exactly these files out of scope. `cargo audit`/`cargo deny` read
  # `Cargo.lock`, but a release bump changes only this workspace's own version
  # entries, never a third-party dependency, so no advisory surface moves.
  #
  # On the predicate: verified against the real branch names, which look like
  # `release-plz-2026-08-19T09-59-50Z`. `github.head_ref` is empty on `push`, so
  # the `event_name` guard makes this false on `main` regardless. Note that
  # `env` is NOT available in a job-level `if:` — only in step-level ones — so
  # the `no-default-features-cells` job below spells the predicate out longhand.
  # Do not "tidy" that into `env.RELEASE_PR`; it would silently stop matching.
  #
  # If a human pushes a real change onto a release-plz branch, it rides this
  # cheap path and is NOT fully tested. In practice release-plz regenerates the
  # branch from scratch on the next merge, so such edits are transient and get
  # discarded rather than merged — but the gap is real, and the answer is to
  # move the change to its own branch, where the full matrix runs.
  RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-') }}

jobs:
  # Pinned to `ubuntu-24.04` rather than `ubuntu-latest`, which resolves to the
  # same image TODAY — so this is not a version change, it is a change in what
  # can move without a diff. `ubuntu-latest` advances to the next LTS on
  # GitHub's schedule; every action here is pinned to a SHA for the same reason
  # (ADR-0017: deliberate, monitored currency rather than whatever arrives).
  # `ubuntu-24.04` will eventually be retired, with warnings in the run log well
  # ahead of time, and that bump is taken deliberately.
  checks:
    runs-on: ubuntu-24.04
    # BOUNDING A RUNAWAY JOB. Until this existed there was no `timeout-minutes`
    # anywhere in this file, so every job inherited GitHub's 6-hour default. That
    # is not a theoretical exposure: eleven jobs across six of the last ~40 CI
    # runs were cancelled at the 6-hour mark, every one of them wedged on the
    # same apt step, for roughly 66 hours of runner time. `checks`, `coverage`
    # and `msrv` were all hit — the last of those is a required check, so a hung
    # run also left a PR unmergeable for six hours with nothing showing red.
    #
    # These numbers are measured, not guessed, from the job durations of the
    # recent successful runs (`gh api repos/:owner/:repo/actions/runs/<id>/jobs`):
    #
    #     job                    n    min     max     mean
    #     checks                13    3.1    52.2     12.8   (minutes)
    #     coverage              12    3.9    45.6     14.7
    #     default-features      28    1.4     4.7      2.2
    #     msrv                  20    0.9    30.6      8.4
    #     no-default-features   28    1.3    28.1      3.1
    #
    # Each bound is roughly 2x the observed maximum. That is deliberately loose:
    # the slowest legitimate runs are cold-cache ones, which happen whenever
    # `Cargo.lock` or the toolchain moves and the key changes, and a bound tight
    # enough to be a performance gate would fail those. This is a backstop
    # against a hang, not a budget — if a job ever legitimately approaches its
    # bound, raise it and re-measure rather than trimming the work.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # ## Full history, because this job's tests read it and had been quietly
          # declining to run for want of it
          #
          # The review corpus pins each adjudicated comment to the commit it was
          # made on, and NINE tests are gated on being able to reconstruct those
          # commits: three in `crates/rto-graph/tests/review_corpus.rs` and six in
          # `roteiro`'s `review_llm` module. (Eight of the nine also *fail* in a full
          # clone today; the ninth returned early on CI with the rest while passing
          # locally, which is why the gated count is the one to state here.) The action's default is `fetch-depth: 1`, which
          # leaves one commit and a shallow boundary, so every one of them returned
          # early — printing a `SKIP:` line that libtest captures and then discards
          # for a passing test. They were invoked, reported as passed, and asserted
          # nothing, on every run since they were written.
          #
          # That is not a hypothetical cost. Two of the corpus's `reviewed_sha`
          # values had been force-pushed out of existence in the meantime; the
          # tests written to catch exactly that fail in any full clone, and `main`
          # stayed green throughout (#822). A gate that cannot execute is not a
          # gate, and it reads in a job summary exactly like one that passed.
          #
          # The cost was measured, not assumed: the pack is ~11 MiB over ~1,800
          # commits, so a full fetch is seconds against this job's 12.8-minute mean
          # (table above).
          #
          # Deleting this line does not restore the old silence. On a runner those
          # tests now FAIL on a shallow clone rather than skipping, with a message
          # naming this setting — the depth is stated here, and the tests refuse to
          # be the reason it looks unnecessary. Both halves came in with #822 and
          # neither is safe to remove alone.
          fetch-depth: 0
      # Pinned to an exact toolchain, not the action's `stable` ref. rustc
      # 1.98.0 shipped on 2026-08-18, `stable` resolved to it overnight, and
      # three new clippy lints turned `main` red with no commit to blame (#563
      # fixed the lints; this is the other half). SHA-pinning the *action* never
      # covered that: `stable` is a branch of the action whose `toolchain` input
      # defaults to `stable`, so the version was still chosen by the runner, on
      # the day, from whatever had been released.
      #
      # This is the `master` ref instead — the same SHA the `msrv` job uses --
      # where `toolchain` is a *required* input with no default. That is why one
      # action ref now serves both purposes, with the version as data in each
      # job rather than encoded in which SHA was used, and it is the reason not
      # to tidy it back to the `# stable` SHA on the grounds that "we want
      # stable": there, a dropped `with:` block silently floats again; here it
      # fails the step.
      #
      # Two components, like `msrv` below, not three: a 1.98.x point release is
      # a targeted fix, not a new lint set, and holding those out would forgo a
      # compiler security fix to close a hole that has never been the failure
      # mode here.
      #
      # ## Raising it is a standing responsibility, and nobody else holds it
      #
      # Dependabot covers `cargo` and `github-actions`, so it keeps the SHA
      # above current — but a toolchain string inside a `with:` block is
      # invisible to it, and nothing else bumps one. Left alone this holds 1.98
      # forever: no new lints, no new fixes, and eventually a compiler that
      # cannot build a dependency that has moved on. That is today's failure
      # arriving quietly instead of loudly, and it is against ADR-0017's
      # "current by default" — the pin buys a commit to blame, not a licence to
      # freeze.
      #
      # To raise it: on the new toolchain run `cargo clippy --workspace
      # --all-targets --all-features -- -D warnings` and the default-features
      # equivalent, fix what they find, and bump every pinned `toolchain:` value
      # in the same commit. Do that when a release has settled, not on the day
      # it ships.
      #
      # They are spread across workflows (`ci.yml`, `graph-artifact.yml`,
      # `release-plz.yml` — whose publish job must not lag behind `checks` —
      # `release-binaries.yml`, `fresh-resolution.yml`), so grep rather than
      # trusting a list here:
      #
      #   grep -rn 'toolchain: "' .github/workflows/
      #
      # `msrv` here and both jobs in `website.yml` are pinned to the MSRV
      # instead, and do NOT move with this bump.
      #
      # A toolchain the canary has already flagged is a toolchain this bump is
      # overdue for; see `toolchain-canary.yml`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: rustfmt, clippy, llvm-tools-preview
      # `cache-on-failure` defaults to false, so a job that fails saves no cache
      # at all — the post-run save step does not execute, and the work of a cold
      # build (a new key whenever `Cargo.lock` or the toolchain moves) is lost.
      #
      # SAVED FROM `main` ONLY (`save-if`). Every job saving on every PR branch
      # put the repository at 11 GB against GitHub's 10 GB cap (measured
      # 2026-11-16), so GitHub evicted least-recently-used entries — `main`'s
      # among them — and runs went cold at random (an 18-minute `main` run beside
      # 7-minute ones). A PR restores `main`'s cache, which is what it shares
      # most with; a PR that moves `Cargo.lock` rebuilds the moved crates on each
      # push, which is the price of the cap.
      #
      # The per-job keys are deliberate: `checks` (`--all-features`, coverage
      # instrumented), `default-features`, each feature-off cell and `msrv`
      # (1.96) produce genuinely different artefacts, and a `shared-key` across
      # them would thrash. A release PR skips the cache entirely: restoring
      # ~1.4 GB to run `cargo metadata` would cost more than the check it serves.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # No apt step anywhere in this file: since ADR-0033 retired llama.cpp no
      # build here needs more than the `cc` the runner ships. The apt install
      # that used to live here was the hang behind all eleven six-hour
      # cancellations; if a dependency ever needs a package, add a step for THAT
      # package with a step-level `timeout-minutes` (`ci_job_timeouts.rs`).
      # The whole of a release PR's verification in this job. See the
      # `RELEASE_PR` comment at the top of this file for what it catches, what
      # it deliberately does not, and why the job runs at all rather than being
      # skipped outright.
      - name: Manifests and lockfile agree
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format
        if: env.RELEASE_PR != 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: env.RELEASE_PR != 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Broken intra-doc links — issue #783. No `RUSTDOCFLAGS` here: the lints
      # are denied in `Cargo.toml`, so this fails on a plain `cargo doc` and
      # keeps failing for anyone who runs it by hand.
      #
      # `--keep-going` because `cargo doc` otherwise stops at the first failing
      # crate. That is how #783's backlog read as 66 links in three crates when
      # it was ~136 across eight, and a job without it would report a shrinking
      # number while the tail stayed hidden.
      #
      # **This is one of seven documented configurations, not the gate.** A
      # broken intra-doc link is created by a `#[cfg(feature = …)]`: a doc
      # compiled under one cfg citing an item behind another. It only breaks in
      # a build where the citing doc is compiled and the cited item is not —
      # never at `--all-features`, which turns everything on (#797, #854). So
      # each cell that already compiles a feature set also documents it:
      #
      #   checks               --all-features         (here)
      #   default-features     the default set        (`provider` and `serve` on)
      #   no-default-features  none, mcp, execution, okf-viewer, explorer
      #
      # Why those: the floor documents every ungated doc that cites a gated item
      # (#792's class); each single-feature cell documents that feature's docs
      # with every other feature off (#797's `explorer`-without-`mcp`); and the
      # default set is where `provider` and `serve` are on with the media
      # features off, which is what `review_llm` straddles (#854). They are
      # also the configurations this file already compiles, so the dependency
      # metadata rustdoc needs is already built — each step costs the rustdoc
      # pass over the workspace crates, not a build.
      #
      # **Not documented**, so a reader knows the gate's shape rather than
      # assuming it is total: the other single-feature points (`models`,
      # `provider` alone, `inference`, `serve`,
      # `exec-subprocess`, `refs-fetch`, `pdf-text`, the `image-*` and `audio-*`
      # media features) and every combination of two or more features other
      # than the default set. A link from a doc behind one of those to an item
      # behind another is still unguarded.
      - name: Docs (intra-doc links)
        if: env.RELEASE_PR != 'true'
        run: cargo doc --workspace --all-features --no-deps --keep-going
      # `--no-fail-fast`, and a report of which test binaries actually ran —
      # issue #906. The two halves are one fix.
      #
      # Without `--no-fail-fast` cargo stops at the first failing test binary
      # and **never runs the later ones**. The job goes red, which reads like
      # honest reporting, but the scope it reports on is smaller than the scope
      # it appears to cover and nothing says which part is missing. Not
      # hypothetical: a fixed-port flake in `serve_mode_selection_cli` truncated
      # this cell repeatedly, and `-p`-scoped runs were added beside it without
      # anyone establishing why the full cell was not reaching those crates.
      # Same family as #822 (a gate that never ran) and #854 (a gate covering
      # one axis reading as coverage across all of them).
      #
      # THE COST, stated rather than left to be discovered: a genuinely broken
      # commit now runs the WHOLE suite instead of stopping at the first
      # failure, so a red run costs more wall-clock than it used to. That is the
      # correct trade — the alternative is a red run whose coverage nobody can
      # state — and the five sibling cells in `default-features` and
      # `no-default-features` already pay it.
      #
      # The `--no-run` pass is what makes the report possible: it records which
      # test binaries were BUILT, the log records which were STARTED, and the
      # script compares the two. A log-only check cannot do this — a fail-fast
      # truncation leaves the log internally consistent, because every `Running`
      # line it contains is followed by a `test result:`. Only the compiled list
      # knows what is missing. It compiles nothing the run below would not
      # compile anyway, so the cost is cargo's own overhead, not a second build.
      #
      # Prebuilt binaries, not `cargo install`: compiling cargo-audit and
      # cargo-deny from source cost 3.9 of this job's 10 minutes on every run.
      - name: Install cargo-llvm-cov, cargo-audit and cargo-deny
        if: env.RELEASE_PR != 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov,cargo-audit,cargo-deny
      # COVERAGE (#319) is measured on this job's own test run. It used to be a
      # job of its own that built and ran the whole `--all-features` suite a
      # second time. `show-env` instruments the workspace crates only (through
      # `RUSTC_WRAPPER`), so the `cargo test` commands below — and the
      # binary report that reads them — are the same commands as before. It is
      # exported through `GITHUB_ENV` so the dogfood step reuses the
      # instrumented build instead of compiling the workspace again. Clippy
      # and rustdoc run above it, untouched by the wrapper.
      - name: Instrument the test build for coverage
        if: env.RELEASE_PR != 'true'
        run: |
          set -euo pipefail
          exports="$(cargo llvm-cov show-env --export-prefix)"
          eval "$exports"
          sed -n 's/^export \([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' <<< "$exports" |
            while read -r name; do printf '%s=%s\n' "$name" "${!name}"; done >> "$GITHUB_ENV"
          cargo llvm-cov clean --profraw-only
      - name: Test
        if: env.RELEASE_PR != 'true'
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --no-run --message-format=json-render-diagnostics > test-targets.json
          cargo test --workspace --all-features --no-fail-fast 2>&1 | tee test-run.log
      # `always()` so a red test step still states what it covered — which is the
      # point: the run that most needs its scope written down is the one that
      # failed. This step fails if any compiled binary was never started.
      - name: Which test binaries actually ran
        if: ${{ always() && env.RELEASE_PR != 'true' }}
        run: python3 scripts/ci-test-cell-report.py --targets test-targets.json --log test-run.log
      - name: Dogfood (roteiro check)
        if: env.RELEASE_PR != 'true'
        run: cargo run -p roteiro -- check
      # MEASURING, NOT BLOCKING. No threshold has been agreed (#319): the 85%
      # per-file floor in ADR-0001 is an aspiration, and switching one on blind
      # would fail thin wiring files nobody wants to pad with ceremonial tests.
      # `continue-on-error` keeps the number from gating a merge; remove it in
      # the same change that adds `--fail-under-lines`, not before. It runs only
      # after a green test step: a figure from a failed run is a partial figure,
      # and publishing it as the figure is what this step must not do.
      - name: Coverage (measured, not gated)
        if: env.RELEASE_PR != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo llvm-cov report --ignore-filename-regex '(tests?/|/target/)' \
            --summary-only | tee coverage-summary.txt
          {
            echo '## Test coverage (measuring only — no gate)'
            echo
            echo 'The 85% per-file floor is **not** enforced. These numbers are'
            echo 'the input to deciding whether it should be.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the per-file coverage report
        if: env.RELEASE_PR != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn
      # DO NOT "fix" this to match the deny step below. `cargo audit` reads
      # **Cargo.lock**, which lists every optional dependency regardless of which
      # features are on, so it already sees the whole feature matrix — it is
      # `cargo deny` that did not (#318). Measured: audit reports `ttf-parser`
      # (reachable only under the opt-in `pdf-text` feature) while `cargo deny
      # check` without `--all-features` said "no crate matched advisory criteria"
      # for the same crate. There is no `--all-features` to add here and it would
      # mean nothing if there were; ADR-0017 §3 records the measurement.
      # Kept as the RustSec-native second opinion. Note it exits 0 on
      # `unmaintained` advisories, so `cargo deny check advisories` — which exits
      # 1 on them — is the enforcing gate of the two.
      #
      # The only audit in this file: `msrv` used to run a second, identical one
      # (same `Cargo.lock`, same advisory database), which turned one new
      # advisory into two red required checks.
      - name: Audit
        if: env.RELEASE_PR != 'true'
        run: cargo audit
      # `--all-features` is what closes #318: without it the licence and advisory
      # checks only saw the default build, and everything behind `models`,
      # `serve`, `pdf-text`, `image-vision`, `audio-transcribe` … was unchecked.
      # It is a *metadata* resolution, not a build — cargo-deny never compiles
      # anything — and costs under a second (ADR-0017).
      - name: Deny (licenses, bans, advisories) across the feature matrix
        if: env.RELEASE_PR != 'true'
        run: cargo deny --all-features check

  # The DEFAULT feature set — the configuration every user installs, and until
  # this job existed the one configuration CI never built.
  #
  # `checks` above is `--all-features` throughout. That is the right scope for
  # the licence/advisory gates, which must see everything the project *ships*,
  # but it means the build a `cargo install roteiro` user actually gets was
  # never compiled here. It had rotted: three `-D warnings` errors across two
  # crates that `--all-features` cannot see, because they are artefacts of code
  # being cfg'd *out* (an emptied test crate losing its `//!` header; helpers
  # left behind when their only callers are gated away). Turning more features
  # on can never find that class of defect. Only building with them off can.
  #
  # REQUIRED, not advisory. Contrast the coverage step in `checks`, which is deliberately
  # `continue-on-error` because no threshold has been agreed and it would fail
  # on day one — an observation, not yet a rule. This job has no such excuse: it
  # is green as of the commit that adds it, so gating costs nothing today and is
  # the only thing that stops it going red unnoticed tomorrow. An advisory
  # version would reproduce the exact failure it exists to prevent — a signal
  # nobody is obliged to read.

  # Pinned, not `ubuntu-latest`; see the `checks` job for why.
  default-features:
    runs-on: ubuntu-24.04
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history; see the `checks` job for what reads it and what the nine
          # tests gated on it were doing without it. This job is the one whose
          # `--no-fail-fast` counts are meant to be a measurement rather than a
          # lower bound, and nine tests reporting as passed while asserting
          # nothing is the other way to get a number that is not one.
          fetch-depth: 0
      # Pinned toolchain, `master` ref of the action; see the `checks` job for
      # why, and for what raising it involves. Bumped with every other pin, in
      # one commit, never alone.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: clippy
      # As in `checks`: saved from `main` only, kept on failure, skipped on a
      # release PR.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file. Only there: on every other
      # run `checks` performs the same check on the same commit (#871). No
      # `cargo fmt` either — rustfmt does not evaluate `cfg`, so it cannot
      # differ from the `checks` job's.
      - name: Manifests and lockfile agree
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Clippy (default features)
        if: env.RELEASE_PR != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` because plain `cargo test` stops at the first failing
      # test binary, which makes the aggregate pass/fail counts a lower bound
      # rather than a measurement. A run that reports every failure is worth the
      # extra minutes when the whole point of the job is to find out what state
      # this feature set is in.
      - name: Test (default features)
        if: env.RELEASE_PR != 'true'
        run: cargo test --workspace --no-fail-fast
      # Intra-doc links at the set a `cargo install roteiro` user builds. See
      # the `checks` job's docs step for why each configuration is documented
      # where it is compiled (#854).
      - name: Docs (default features)
        if: env.RELEASE_PR != 'true'
        run: cargo doc --workspace --no-deps --keep-going

  # The feature sets with `execution` OFF, and the one that only provisions.
  #
  # Read the name literally, because for a long time it was not true. Until #667
  # this job ran exactly one command — `--no-default-features --features
  # execution` — so the job called `no-default-features` turned a feature back
  # on, and with `checks`/`coverage`/`msrv` on `--all-features` and
  # `default-features` on the default set (which contains `execution`), **every
  # cell of the matrix carried `execution` and no configuration without it was
  # ever compiled**.
  #
  # What that cost, measured on `main` rather than argued: `cargo check -p
  # roteiro --no-default-features --features mcp` failed with `cannot find module
  # or crate rto_exec`. `--features mcp` is a documented way to build the MCP
  # server (README) and it had been broken unnoticed, because nothing built it.
  # Two `-D warnings` rejections of the familiar artefact-of-exclusion class sat
  # behind it.
  #
  # And it recurred **while #667 was open**, which is the argument for a cell
  # rather than a one-line fix. The reference the issue reported was the
  # workspace-vault renderer stamping `generated_at` with `rto_exec::rfc3339_utc`.
  # #671 deleted that renderer outright and replaced it with the OKF one — and the
  # replacement reached for `rto_exec::rfc3339_from_unix` in `okf_instant`, so the
  # identical compile error came back at a new line number in the same week. A
  # render path is ungated and wants a timestamp; nothing but a build stops it
  # reaching into an optional crate for one. The formatter now lives in
  # `rto-graph`, which every configuration links.
  #
  # It also made a gate vacuous. `#[cfg(feature = "execution")]` is a cfg that was
  # true in every job, so a test carrying it ran everywhere and said nothing about
  # the configuration that was broken — and three `#[cfg(not(feature =
  # "execution"))]` arms in `rto-render`'s MCP tests ran in **no job at all**. The
  # `Test (mcp only …)` step below is what exercises them; a clippy-only cell
  # would compile those arms and still never run them.
  #
  # Five cells, and each is a configuration the documentation offers:
  #
  #   * `--no-default-features` — the floor. `crates/roteiro/Cargo.toml` promises
  #     it "still yields a binary with no analyzer surface at all"; this is what
  #     makes that a checked claim rather than a comment.
  #   * `--no-default-features --features mcp` — the combination #667 reproduced
  #     the breakage with. Not implied by the floor: `mcp` compiles the whole
  #     `rto-render::mcp` surface and `dep:tokio`, which the floor leaves out.
  #   * `--no-default-features --features execution` — the ADR-0014 posture,
  #     below, unchanged.
  #   * `--no-default-features --features explorer` — the explorer on its own.
  #     Not implied by the viewer cell below: `okf-viewer` enables `explorer`, so
  #     that cell builds a superset and cannot fail on what only the smaller
  #     shape reaches. It went unbuilt once and broke immediately — see the job.
  #   * `--no-default-features --features okf-viewer` — ADR-0022's commitment.
  #     A new optional feature that no job compiled in isolation would be the
  #     fourth defect of this exact class in a year (`vlm_content` under
  #     `image-ocr`, four unused items under `audio-transcribe`, and #445's
  #     `execution` drift), so the ADR made the cell part of the decision rather
  #     than a follow-up. Note what it does NOT cover: the rules about untrusted
  #     content live in `rto_render::okf::view`, which is unconditional and so is
  #     already built and run by every job here.
  #
  # The cells run in parallel, as a matrix — they used to run one after another
  # in one job, which made it the slowest in the file (10 minutes against
  # `checks`' 10, measured 2026-11-16). Matrix cells report as
  # `no-default-features (<cell>)`, but `no-default-features` is a REQUIRED
  # status check on `main` (branch protection lists it by name), and a required
  # context that names no job wedges every PR with nothing red to look at. So
  # the required context is the small job of that name below, which fails unless
  # every cell succeeded.
  #
  # ADR-0014 v1.2 names `--no-default-features --features execution` as a
  # supported build. Nothing compiled it, and by issue #445 it had drifted into
  # two compile errors and five `-D warnings` rejections — every one of them an
  # *artefact of exclusion*: items whose only callers are cfg'd out, a test
  # calling a signature that changed where it could not see, and a `ModelTask`
  # behind a feature this set does not have.
  #
  # This is #360's shape one configuration over, and it is why the job exists
  # rather than the claim being struck from the ADR: **turning features on can
  # never find a defect caused by code being cfg'd out**, so `checks`
  # (`--all-features`) and `default-features` are both structurally blind to the
  # whole class. Only a job that turns features *off* can see any of it.
  #
  # Clippy AND tests, matching `default-features`. The test step is not ceremony:
  # `the_host_path_is_absent_but_names_the_feature` is gated
  # `not(exec-subprocess)` and so runs in **no other job** — it is where #445's
  # E0061 lived, and a clippy-only job would compile it and still never run it.
  # Likewise `rto-render`'s three `cfg(not(feature = "execution"))` arms live in
  # the `mcp` module and run only in the `mcp` cell, and the okf-viewer route
  # tests are `#[cfg(feature = "okf-viewer")]`.
  #
  # The `explorer` cell is not implied by the `okf-viewer` one: `okf-viewer`
  # enables `explorer`, so that cell builds both, and this is the only cell that
  # compiles the explorer on its own. It was broken for exactly as long as
  # nothing built it — `serve_graph_ui` reached for a multi-threaded runtime
  # whose feature only `okf-viewer` enabled.
  #
  # NOT a required check itself (the job below is), so it is skipped outright on
  # a release PR, where a version bump turns no feature off. The predicate is
  # longhand because `env` is not available in a job-level `if:`.
  no-default-features-cells:
    name: no-default-features (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release-plz-')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor: no feature on anywhere. Every other cell builds a
          # superset of it. Its docs step is where an ungated doc citing a
          # gated item breaks (#792); each feature cell catches a doc behind
          # one feature citing an item behind another (#797).
          - cell: none
            features: ""
          - cell: mcp
            features: "--features mcp"
          - cell: execution
            features: "--features execution"
          - cell: okf-viewer
            features: "--features okf-viewer"
          - cell: explorer
            features: "--features explorer"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history; see the `checks` job. The corpus tests are in every
          # cell: `review_llm` is declared `#[cfg(any(feature = "provider",
          # test))]`, so turning features off does not turn this requirement
          # off with them.
          fetch-depth: 0
      # Pinned toolchain, `master` ref of the action; see the `checks` job.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
          components: clippy
      # One cache per cell — they compile different dependency sets. Saved from
      # `main` only; see the `checks` job.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.cell }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-default-features ${{ matrix.features }} -- -D warnings
      # `--no-fail-fast` for the reason `checks` records (#906).
      - name: Test
        run: cargo test --workspace --no-default-features ${{ matrix.features }} --no-fail-fast
      - name: Docs
        run: cargo doc --workspace --no-default-features ${{ matrix.features }} --no-deps --keep-going

  # The REQUIRED `no-default-features` context: green only when every cell
  # above succeeded.
  #
  # `if: always()` is load-bearing. Without it, a failed cell makes this job
  # `skipped` — and branch protection counts `skipped` as success, so a broken
  # cell would merge. `always()` cannot skip, which is why
  # `ci_release_pr_parity.rs` allows it and no other job-level condition on a
  # required job. On a release PR the cells are skipped and this job does the
  # manifest check, as every required job does there.
  no-default-features:
    needs: no-default-features-cells
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98"
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file.
      - name: Manifests and lockfile agree
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Every feature-off cell passed
        if: env.RELEASE_PR != 'true'
        env:
          RESULT: ${{ needs.no-default-features-cells.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::a no-default-features cell did not succeed (result: $RESULT); see the cell jobs"
            exit 1
          fi

  # Pinned, not `ubuntu-latest`; see the `checks` job for why.
  msrv:
    runs-on: ubuntu-24.04
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 60
    steps:
      # The one checkout in this file deliberately left shallow, and the reason is
      # the rule rather than an exception to it: `fetch-depth: 0` is for jobs that
      # RUN TESTS, because the review-corpus tests read git history (see `checks`).
      # This job only runs `cargo check`, which reads none, so full history would
      # buy nothing. If a `cargo test` is ever added here, add the depth with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.96"
      # As in `checks`: saved from `main` only, kept on failure, skipped on a
      # release PR.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file. Running it on the 1.96
      # toolchain rather than stable earns this job something the other two
      # cannot: it proves the `Cargo.lock` release-plz just rewrote is still
      # parseable by MSRV cargo. A lockfile regenerated in a newer format is a
      # real way for a version bump to break the MSRV build, and it is exactly
      # what this job exists to notice.
      - name: Manifests and lockfile agree, on MSRV cargo
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build on MSRV
        if: env.RELEASE_PR != 'true'
        run: cargo check --workspace --all-features
