name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a superseded run, but only when nobody wants its result.
#
# `cancel-in-progress` is an expression, not `true`, and the distinction is the
# whole point:
#
# - `pull_request` -> CANCEL. A new push to a PR makes the previous run's
#   verdict worthless. Four of twelve in-flight runs were once found to be for
#   already-merged PRs, two of them `in_progress` for 151 and 167 minutes,
#   holding runners rather than merely queued.
# - `push` to `main` -> KEEP. These runs are the record that a merged commit was
#   green. A cancelled run leaves no such record, and cancelling it to save a
#   runner trades the evidence for the change. `release-plz.yml` sets `false`
#   for the same reason.
# - `workflow_dispatch` -> KEEP. Somebody asked for this run by hand.
#
# On the branch-protection interaction, which is load-bearing now that `checks`,
# `default-features` and `msrv` are required checks: a cancelled job reports
# `status=completed, conclusion=cancelled`, which is terminal and is NOT a
# success, so it does not satisfy a required check. That is safe here only
# because a cancellation is always *caused by* a superseding run in the same
# group, and the last run in any such chain is by definition not cancelled — it
# completes and reports on what is then the PR's head commit, which is the only
# commit branch protection evaluates. The stale `cancelled` results are left
# behind on commits that are no longer the head.
#
# The consequence to respect: never cancel a run without a successor to report
# in its place. That is why this is scoped to the event type and not to, say, a
# schedule or a manual sweep.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Is this run a release-plz version-bump PR?
  #
  # release-plz opens a PR whose entire diff is version fields and changelog
  # prose — for v1.25.0 (#479) exactly five files: `Cargo.toml`, `Cargo.lock`
  # and three `CHANGELOG.md`, 9 lines changed in each manifest and pure
  # additions in the changelogs. Building the full matrix for that cost 888
  # job-seconds on the `pull_request` event alone (checks 240s, coverage 452s,
  # default-features 145s, msrv 51s). And it recurs: release-plz opens a NEW PR
  # on a NEW timestamped branch every time `main` moves and closes the previous
  # one — three in eight minutes on 2026-08-19 — each firing the whole matrix.
  #
  # THE CONSTRAINT THAT SHAPES EVERYTHING BELOW. `main` requires the status
  # checks `checks`, `default-features` and `msrv`. Per GitHub's documentation,
  # a workflow skipped by path, branch or commit-message filtering leaves its
  # "associated checks ... in a 'Pending' state" and "a pull request that
  # requires those checks to be successful will be blocked from merging". So a
  # workflow-level `paths-ignore`/`branches-ignore` here would not save runner
  # time, it would make every future release PR permanently unmergeable without
  # an admin bypass, with nothing showing red to explain why. That is the same
  # trap that disqualified `website.yml`'s path-filtered jobs from being
  # required checks. Do not reach for a workflow-level filter.
  #
  # A job-level `if:` would in fact be safe — GitHub documents that "a job that
  # is skipped will report its status as 'Success'. It will not prevent a pull
  # request from merging, even if it is a required check", and lists `skipped`
  # among the successful check statuses alongside `success` and `neutral`. That
  # was checked rather than assumed, precisely because the failure mode is
  # permanent.
  #
  # The jobs that ARE required checks nonetheless RUN on a release PR, and skip
  # at the STEP level, for a reason that is not timidity about the above:
  # skipping the whole job would mean verifying nothing, and a version bump is
  # not a no-op. It can desynchronise `Cargo.lock` from the manifests, and it
  # can move a `version =` constraint on a workspace path dependency ahead of
  # the member it points at. release-plz rewrites the workspace `version` AND
  # the pinned `version =` on all eight path dependencies in `Cargo.toml`, so
  # that shape is not hypothetical. `cargo metadata --locked` catches both in
  # well under a second without compiling anything, and it can only run if the
  # job runs.
  #
  # WHICH jobs those are is deliberately not written down here. That is a fact
  # about branch protection rather than about this file, and a count in prose
  # beside a set the file itself defines goes stale in silence: this sentence
  # said "these three jobs" for a while after there were four, which is the
  # same rot one level down from the defect #494 is about.
  # `crates/roteiro/tests/ci_release_pr_parity.rs` holds the list, names branch
  # protection as its source and says how to re-read it, and fails if a
  # required job loses either arm or if a job appears here that nobody
  # classified as required or not. Add a job below and that test will tell you
  # what it needs.
  #
  # Both halves were confirmed by injecting them into this workspace:
  #   - workspace `version` bumped, `Cargo.lock` left behind
  #     -> "cannot update the lock file ... because --locked was passed", exit 101
  #   - `rto-exec`'s path-dependency constraint moved to 1.26.0, member at 1.25.0
  #     -> "failed to select a version for the requirement `rto-exec = ^1.26.0`",
  #        exit 101
  #
  # So the required contexts are satisfied by a genuine `success` from a job
  # that actually verified something, rather than by `skipped`-counts-as-success
  # semantics. The premium is roughly ten seconds of runner setup per job.
  #
  # What is deliberately NOT re-verified, and why it is proportionate: the
  # compile-and-test steps below cannot be affected by changelog prose, and
  # `roteiro.toml` already excludes `**/CHANGELOG.md` and `**/Cargo.toml` from
  # the debt scan that `roteiro check` runs — the project's own gate declares
  # exactly these files out of scope. `cargo audit`/`cargo deny` read
  # `Cargo.lock`, but a release bump changes only this workspace's own version
  # entries, never a third-party dependency, so no advisory surface moves.
  #
  # On the predicate: verified against the real branch names, which look like
  # `release-plz-2026-08-19T09-59-50Z`. `github.head_ref` is empty on `push`, so
  # the `event_name` guard makes this false on `main` regardless. Note that
  # `env` is NOT available in a job-level `if:` — only in step-level ones — so
  # the `coverage` job below spells the predicate out longhand. Do not "tidy"
  # that into `env.RELEASE_PR`; it would silently stop matching.
  #
  # If a human pushes a real change onto a release-plz branch, it rides this
  # cheap path and is NOT fully tested. In practice release-plz regenerates the
  # branch from scratch on the next merge, so such edits are transient and get
  # discarded rather than merged — but the gap is real, and the answer is to
  # move the change to its own branch, where the full matrix runs.
  RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-plz-') }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # BOUNDING A RUNAWAY JOB. Until this existed there was no `timeout-minutes`
    # anywhere in this file, so every job inherited GitHub's 6-hour default. That
    # is not a theoretical exposure: eleven jobs across six of the last ~40 CI
    # runs were cancelled at the 6-hour mark, every one of them wedged on the
    # same apt step, for roughly 66 hours of runner time. `checks`, `coverage`
    # and `msrv` were all hit — the last of those is a required check, so a hung
    # run also left a PR unmergeable for six hours with nothing showing red.
    #
    # These numbers are measured, not guessed, from the job durations of the
    # recent successful runs (`gh api repos/:owner/:repo/actions/runs/<id>/jobs`):
    #
    #     job                    n    min     max     mean
    #     checks                13    3.1    52.2     12.8   (minutes)
    #     coverage              12    3.9    45.6     14.7
    #     default-features      28    1.4     4.7      2.2
    #     msrv                  20    0.9    30.6      8.4
    #     no-default-features   28    1.3    28.1      3.1
    #
    # Each bound is roughly 2x the observed maximum. That is deliberately loose:
    # the slowest legitimate runs are cold-cache ones, which happen whenever
    # `Cargo.lock` or the toolchain moves and the key changes, and a bound tight
    # enough to be a performance gate would fail those. This is a backstop
    # against a hang, not a budget — if a job ever legitimately approaches its
    # bound, raise it and re-measure rather than trimming the work.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # `cache-on-failure` defaults to false, so a job that fails saves no cache
      # at all — the post-run save step does not execute. The runs that most
      # need to be fast are the ones iterating on a failure, which is exactly
      # when the default discards the work. It bites when the cache key is new
      # (the key hashes `Cargo.lock` and the toolchain, so any bump makes one):
      # the failing run builds ~1.4 GB of artefacts, vendored llama.cpp among
      # them, and then throws them away.
      #
      # The per-job keys below are deliberate and stay as they are — `checks`
      # (`--all-features`), `default-features`, `msrv` (1.94) and `coverage`
      # (`-C instrument-coverage`) produce genuinely different artefacts, and a
      # `shared-key` across them would thrash.
      # Restoring (and re-saving) ~1.4 GB of build artefacts to run `cargo
      # metadata` would cost far more than the check it serves, so a release PR
      # skips the cache entirely rather than warming one it will not use.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
      # The opt-in `serve` feature builds vendored llama.cpp (ADR-0006), which
      # `--all-features` below pulls in. cmake + libclang (bindgen) are required;
      # the compiled artefacts are cached by rust-cache across runs.
      # BOUNDING THE MIRROR, NOT JUST THE STEP. This step is where every one of
      # the six-hour hangs happened. The obvious fix — a short `timeout-minutes`
      # — is wrong on its own, and the measurement says why. Across the last ~40
      # runs the *successful* durations of this step were, in seconds:
      #
      #   12 12 13 14 14 16 17 19 45 49 57 60 66 68 70 71 83 83 95 129 131 140
      #   141 151 193 361 468 497 1141 1367 2201 2222
      #
      # Median 83s, but six succeeded after more than six minutes and four after
      # 19-37 minutes. A bare five-minute step bound would therefore have turned
      # roughly a fifth of currently-green runs red. The tail is not a different
      # failure from the hang — it is the same degraded mirror, sometimes
      # recovering and sometimes not.
      #
      # So the bound goes on the *fetch* rather than only on the step:
      # `Acquire::http::Timeout` caps each stalled socket read at 30s and
      # `Acquire::Retries` bounds the reattempts, which is what makes a tight
      # step bound safe rather than merely aggressive. A wedged mirror now fails
      # in minutes, naming itself, and a re-run fixes it; a slow-but-alive
      # mirror still completes. `timeout-minutes` below is the backstop for what
      # the transport options cannot see — a dpkg lock, say — not the first line
      # of defence.
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        if: env.RELEASE_PR != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake clang libclang-dev \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        if: env.RELEASE_PR != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y protobuf-compiler \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        if: env.RELEASE_PR != 'true'
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      # The whole of a release PR's verification in this job. See the
      # `RELEASE_PR` comment at the top of this file for what it catches, what
      # it deliberately does not, and why the job runs at all rather than being
      # skipped outright.
      - name: Manifests and lockfile agree (release PR)
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Format
        if: env.RELEASE_PR != 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: env.RELEASE_PR != 'true'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        if: env.RELEASE_PR != 'true'
        run: cargo test --workspace --all-features
      - name: Dogfood (roteiro check)
        if: env.RELEASE_PR != 'true'
        run: cargo run -p roteiro -- check
      # DO NOT "fix" this to match the deny step below. `cargo audit` reads
      # **Cargo.lock**, which lists every optional dependency regardless of which
      # features are on, so it already sees the whole feature matrix — it is
      # `cargo deny` that did not (#318). Measured: audit reports `ttf-parser`
      # (reachable only under the opt-in `pdf-text` feature) while `cargo deny
      # check` without `--all-features` said "no crate matched advisory criteria"
      # for the same crate. There is no `--all-features` to add here and it would
      # mean nothing if there were; ADR-0017 §3 records the measurement.
      # Kept as the RustSec-native second opinion. Note it exits 0 on
      # `unmaintained` advisories, so `cargo deny check advisories` — which exits
      # 1 on them — is the enforcing gate of the two.
      - name: Audit
        if: env.RELEASE_PR != 'true'
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # `--all-features` is what closes #318: without it the licence and advisory
      # checks only saw the default build, and everything behind `models`,
      # `serve`, `pdf-text`, `image-vision`, `audio-transcribe` … was unchecked.
      # It is a *metadata* resolution, not a build — cargo-deny never compiles
      # anything — so this does **not** build llama.cpp or the tree-sitter
      # grammars and costs under a second on top of the install (ADR-0017).
      - name: Deny (licenses, bans, advisories) across the feature matrix
        if: env.RELEASE_PR != 'true'
        run: |
          cargo install cargo-deny --locked
          cargo deny --all-features check

  # The DEFAULT feature set — the configuration every user installs, and until
  # this job existed the one configuration CI never built.
  #
  # `checks` above is `--all-features` throughout. That is the right scope for
  # the licence/advisory gates, which must see everything the project *ships*,
  # but it means the build a `cargo install roteiro` user actually gets was
  # never compiled here. It had rotted: three `-D warnings` errors across two
  # crates that `--all-features` cannot see, because they are artefacts of code
  # being cfg'd *out* (an emptied test crate losing its `//!` header; helpers
  # left behind when their only callers are gated away). Turning more features
  # on can never find that class of defect. Only building with them off can.
  #
  # REQUIRED, not advisory. Contrast `coverage` below, which is deliberately
  # `continue-on-error` because no threshold has been agreed and it would fail
  # on day one — an observation, not yet a rule. This job has no such excuse: it
  # is green as of the commit that adds it, so gating costs nothing today and is
  # the only thing that stops it going red unnoticed tomorrow. An advisory
  # version would reproduce the exact failure it exists to prevent — a signal
  # nobody is obliged to read.
  #
  # It needs NO cmake/libclang, and that is a change from how this job started
  # (#483). It used to install them, because `rto-llama` declared a NON-optional
  # dev-dependency on `llama-cpp-2` — and dev-dependencies are never
  # feature-gated, so `--all-targets` built vendored llama.cpp here even at the
  # default feature set, where no test target could name the crate. That entry is
  # gone; the optional `[dependencies]` one, which Cargo already passes to test
  # targets, serves them instead. `cargo tree --edges normal,dev -i
  # llama-cpp-sys-2` at this feature set now reports no such package at all, and
  # a cold `--all-targets` run compiles neither bindgen, clang-sys, cmake, nor
  # llama-cpp-sys-2. Do not re-add the install step without first checking that
  # command still says so.
  #
  # `cargo build`/`cargo install` at the default set never paid this either way;
  # the cost was confined to `--all-targets`, i.e. to CI.
  #
  # protoc and the sandbox runtime are NOT needed and deliberately absent:
  # `exec-boxlite` is off in `rto-exec`'s default set, so nothing here trips
  # `rto-exec/build.rs`'s BOXLITE_RUNTIME_URL requirement.
  default-features:
    runs-on: ubuntu-latest
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # A failed run must still save its cache, as above. Skipped on a release
      # PR for the reason given in the `checks` job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file.
      - name: Manifests and lockfile agree (release PR)
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      # rustfmt does not evaluate `cfg`, so this cannot differ from the `checks`
      # job's formatting step. Kept anyway: it costs seconds, and it makes this
      # job a complete statement of "the default set is healthy" rather than one
      # that quietly depends on another job having run.
      - name: Format
        if: env.RELEASE_PR != 'true'
        run: cargo fmt --all --check
      - name: Clippy (default features)
        if: env.RELEASE_PR != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` because plain `cargo test` stops at the first failing
      # test binary, which makes the aggregate pass/fail counts a lower bound
      # rather than a measurement. A run that reports every failure is worth the
      # extra minutes when the whole point of the job is to find out what state
      # this feature set is in.
      - name: Test (default features)
        if: env.RELEASE_PR != 'true'
        run: cargo test --workspace --no-fail-fast

  # The ADR-0014 posture that provisions and ingests but cannot execute.
  #
  # ADR-0014 v1.2 names `--no-default-features --features execution` as a
  # supported build. Nothing compiled it, and by issue #445 it had drifted into
  # two compile errors and five `-D warnings` rejections — every one of them an
  # *artefact of exclusion*: items whose only callers are cfg'd out, a test
  # calling a signature that changed where it could not see, and a `ModelTask`
  # behind a feature this set does not have.
  #
  # This is #360's shape one configuration over, and it is why the job exists
  # rather than the claim being struck from the ADR: **turning features on can
  # never find a defect caused by code being cfg'd out**, so `checks`
  # (`--all-features`) and `default-features` are both structurally blind to the
  # whole class. Only a job that turns features *off* can see any of it.
  #
  # Clippy AND tests, matching `default-features`. The test step is not ceremony:
  # `the_host_path_is_absent_but_names_the_feature` is gated
  # `not(exec-subprocess)` and so runs in **no other job** — it is where #445's
  # E0061 lived, and a clippy-only job would compile it and still never run it.
  #
  # No cmake/libclang, for the reason spelled out on `default-features` above:
  # `rto-llama`'s unconditional dev-dependency on `llama-cpp-2` used to drag
  # vendored llama.cpp into every feature set's `--all-targets` build, and it is
  # gone (#483). This job was the worst-hit — it is the feature set that should
  # contain no llama.cpp at all, and it was building the whole C++ tree. Measured
  # on a cold target dir at `--no-default-features --features execution`:
  # 35.5s → 14.1s wall, 235s → 63s of CPU. Nothing left in this graph needs more
  # than the `cc` the runner already ships (tree-sitter, libsqlite3-sys, ring).
  #
  # protoc and the sandbox runtime are NOT needed and are deliberately absent:
  # `--no-default-features` leaves `exec-boxlite` off in every workspace member,
  # so nothing trips `rto-exec/build.rs`'s BOXLITE_RUNTIME_URL requirement.
  no-default-features:
    runs-on: ubuntu-latest
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      # A failed run must still save its cache, as above. Skipped on a release
      # PR for the reason given in the `checks` job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file. The reason this job exists
      # is that turning features *off* finds defects the other jobs are blind
      # to; a version bump turns no feature off, so it moves nothing in that
      # class, and the manifest check is the whole of what is at stake here as
      # well. This job is a required check on `main`, so it must still RUN and
      # report — see the `checks` job for why a skipped job would be safe and is
      # still not what this file does.
      - name: Manifests and lockfile agree (release PR)
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Clippy (execution only, no default features)
        if: env.RELEASE_PR != 'true'
        run: cargo clippy --workspace --all-targets --no-default-features --features execution -- -D warnings
      # `--no-fail-fast` for the reason `default-features` records: plain `cargo
      # test` stops at the first failing binary, which makes the totals a lower
      # bound rather than a measurement.
      - name: Test (execution only, no default features)
        if: env.RELEASE_PR != 'true'
        run: cargo test --workspace --no-default-features --features execution --no-fail-fast

  # Test coverage — MEASURING, NOT BLOCKING (issue #319).
  #
  # The docs asserted for a long time that `cargo-llvm-cov` ran here with an 85%
  # per-file floor. It did not: nothing in this file mentioned coverage at all,
  # so every stage DoD citing "85% coverage" was unverifiable. This job makes the
  # number real. It deliberately does NOT enforce a threshold yet.
  #
  # Why measure before gating: a *per-file* floor is stricter than most projects
  # run, and switching one on blind would immediately fail thin wiring files that
  # nobody wants to pad with ceremonial tests. The real numbers are what makes a
  # threshold decision possible. Turning the floor on is a separate, deliberate
  # change — `cargo llvm-cov --fail-under-lines N` (workspace) is the knob, and
  # a genuine per-file floor needs a check over the per-file table below.
  #
  # `continue-on-error` keeps a coverage regression from blocking a merge while
  # the number is only being observed. Remove it in the same change that adds a
  # threshold, not before — a job that can fail but is ignored is the same class
  # of untruth this job exists to end.
  #
  # Scope: `--all-features`, matching the `checks` job, so the measured surface
  # is the surface that is tested. That builds vendored llama.cpp (`serve`), so
  # the same apt packages are needed; rust-cache carries the artefacts between
  # runs. If this ever proves too slow to keep, narrow it to default features and
  # SAY SO in the summary — a partial measurement reported as partial is honest,
  # a gate that times out is not.
  coverage:
    runs-on: ubuntu-latest
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 90
    # PULL REQUESTS ONLY, and that is deliberate — this is NOT an oversight to
    # be "fixed" back to matching `checks` and `default-features` above.
    #
    # This is the most expensive job in the matrix, and per the comment above it
    # measures a number that nothing gates on: there is no ratchet (#319), and it
    # is deliberately not a required status check. A PR is where that number is
    # actually read, by someone deciding whether a change carries its tests. A
    # push to `main` has no reader and no consequence — the merge has already
    # happened, and nobody acts on a coverage delta within the minute.
    #
    # `checks` and `default-features` keep running on `push` for a reason that
    # does not apply to coverage: they are the only detectors for two PRs that
    # were green apart and red together, which is exactly how #316/#317's
    # `EXTRACT_VERSION` collision broke `main`. Branch protection is now
    # `strict`, so a branch must be up to date before merging and that class of
    # break is much less likely — but less likely is not impossible, and those
    # two jobs are cheap. This one is not.
    #
    # The release-plz exclusion added alongside it closes the hole that gating
    # on `pull_request` alone left open: a release PR IS a pull request, so this
    # job — the single most expensive in the matrix at 452s — ran in full on
    # every version bump. Gating out the `push` half removed the cheap
    # duplication and kept the expensive half. There is no coverage delta to
    # read on a diff of version fields and changelog prose.
    #
    # This one is a JOB-level `if:`, unlike the step-level gates in the jobs
    # that are required checks, and that asymmetry is deliberate: `coverage` is
    # not a required status check, so nothing here depends on how branch
    # protection treats a skipped job. It can be skipped outright for the full
    # saving. The predicate is spelled out longhand because the `env` context
    # is not available in a job-level `if:` — `env.RELEASE_PR` would silently
    # never match here.
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-plz-')
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      # A failed run must still save its cache, as above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake clang libclang-dev \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y protobuf-compiler \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage (per file + workspace total)
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex '(tests?/|/target/)' \
            --summary-only | tee coverage-summary.txt
      - name: Report the numbers that a threshold decision needs
        if: always()
        run: |
          {
            echo '## Test coverage (measuring only — no gate)'
            echo
            echo 'The 85% per-file floor is **not** enforced. These numbers are'
            echo 'the input to deciding whether it should be.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full per-file report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    # A backstop against a hung step, not a budget. See `checks` for the
    # measured durations these bounds are sized against.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94"
      # A failed run must still save its cache, as above. Skipped on a release
      # PR for the reason given in the `checks` job.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.RELEASE_PR != 'true'
        with:
          cache-on-failure: true
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        if: env.RELEASE_PR != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y cmake clang libclang-dev \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        if: env.RELEASE_PR != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y protobuf-compiler \
            || { echo "::error::apt could not reach the Ubuntu mirror after 3 bounded retries per file with a 30s socket timeout. This is a transient mirror failure, not a packaging error — re-run the job."; exit 1; }
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        if: env.RELEASE_PR != 'true'
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      # The whole of a release PR's verification in this job — see the
      # `RELEASE_PR` comment at the top of this file. Running it on the 1.94
      # toolchain rather than stable earns this job something the other two
      # cannot: it proves the `Cargo.lock` release-plz just rewrote is still
      # parseable by MSRV cargo. A lockfile regenerated in a newer format is a
      # real way for a version bump to break the MSRV build, and it is exactly
      # what this job exists to notice.
      - name: Manifests and lockfile agree, on MSRV cargo (release PR)
        if: env.RELEASE_PR == 'true'
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Build on MSRV
        if: env.RELEASE_PR != 'true'
        run: cargo check --workspace --all-features
      - name: Audit on MSRV lockfile
        if: env.RELEASE_PR != 'true'
        run: |
          cargo install cargo-audit --locked
          cargo audit
