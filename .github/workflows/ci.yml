name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The opt-in `serve` feature builds vendored llama.cpp (ADR-0006), which
      # `--all-features` below pulls in. cmake + libclang (bindgen) are required;
      # the compiled artefacts are cached by rust-cache across runs.
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Dogfood (roteiro check)
        run: cargo run -p roteiro -- check
      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: Deny (licenses, bans, advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      - name: Build on MSRV
        run: cargo check --workspace --all-features
      - name: Audit on MSRV lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit
