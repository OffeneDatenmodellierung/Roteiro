name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The opt-in `serve` feature builds vendored llama.cpp (ADR-0006), which
      # `--all-features` below pulls in. cmake + libclang (bindgen) are required;
      # the compiled artefacts are cached by rust-cache across runs.
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network. `rto-exec/build.rs` refuses to build without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Dogfood (roteiro check)
        run: cargo run -p roteiro -- check
      # DO NOT "fix" this to match the deny step below. `cargo audit` reads
      # **Cargo.lock**, which lists every optional dependency regardless of which
      # features are on, so it already sees the whole feature matrix — it is
      # `cargo deny` that did not (#318). Measured: audit reports `ttf-parser`
      # (reachable only under the opt-in `pdf-text` feature) while `cargo deny
      # check` without `--all-features` said "no crate matched advisory criteria"
      # for the same crate. There is no `--all-features` to add here and it would
      # mean nothing if there were; ADR-0017 §3 records the measurement.
      # Kept as the RustSec-native second opinion. Note it exits 0 on
      # `unmaintained` advisories, so `cargo deny check advisories` — which exits
      # 1 on them — is the enforcing gate of the two.
      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # `--all-features` is what closes #318: without it the licence and advisory
      # checks only saw the default build, and everything behind `models`,
      # `serve`, `pdf-text`, `image-vision`, `audio-transcribe` … was unchecked.
      # It is a *metadata* resolution, not a build — cargo-deny never compiles
      # anything — so this does **not** build llama.cpp or the tree-sitter
      # grammars and costs under a second on top of the install (ADR-0017).
      - name: Deny (licenses, bans, advisories) across the feature matrix
        run: |
          cargo install cargo-deny --locked
          cargo deny --all-features check

  # Test coverage — MEASURING, NOT BLOCKING (issue #319).
  #
  # The docs asserted for a long time that `cargo-llvm-cov` ran here with an 85%
  # per-file floor. It did not: nothing in this file mentioned coverage at all,
  # so every stage DoD citing "85% coverage" was unverifiable. This job makes the
  # number real. It deliberately does NOT enforce a threshold yet.
  #
  # Why measure before gating: a *per-file* floor is stricter than most projects
  # run, and switching one on blind would immediately fail thin wiring files that
  # nobody wants to pad with ceremonial tests. The real numbers are what makes a
  # threshold decision possible. Turning the floor on is a separate, deliberate
  # change — `cargo llvm-cov --fail-under-lines N` (workspace) is the knob, and
  # a genuine per-file floor needs a check over the per-file table below.
  #
  # `continue-on-error` keeps a coverage regression from blocking a merge while
  # the number is only being observed. Remove it in the same change that adds a
  # threshold, not before — a job that can fail but is ignored is the same class
  # of untruth this job exists to end.
  #
  # Scope: `--all-features`, matching the `checks` job, so the measured surface
  # is the surface that is tested. That builds vendored llama.cpp (`serve`), so
  # the same apt packages are needed; rust-cache carries the artefacts between
  # runs. If this ever proves too slow to keep, narrow it to default features and
  # SAY SO in the summary — a partial measurement reported as partial is honest,
  # a gate that times out is not.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network. `rto-exec/build.rs` refuses to build without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage (per file + workspace total)
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex '(tests?/|/target/)' \
            --summary-only | tee coverage-summary.txt
      - name: Report the numbers that a threshold decision needs
        if: always()
        run: |
          {
            echo '## Test coverage (measuring only — no gate)'
            echo
            echo 'The 85% per-file floor is **not** enforced. These numbers are'
            echo 'the input to deciding whether it should be.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full per-file report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network. `rto-exec/build.rs` refuses to build without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Build on MSRV
        run: cargo check --workspace --all-features
      - name: Audit on MSRV lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit
