name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # `cache-on-failure` defaults to false, so a job that fails saves no cache
      # at all — the post-run save step does not execute. The runs that most
      # need to be fast are the ones iterating on a failure, which is exactly
      # when the default discards the work. It bites when the cache key is new
      # (the key hashes `Cargo.lock` and the toolchain, so any bump makes one):
      # the failing run builds ~1.4 GB of artefacts, vendored llama.cpp among
      # them, and then throws them away.
      #
      # The per-job keys below are deliberate and stay as they are — `checks`
      # (`--all-features`), `default-features`, `msrv` (1.94) and `coverage`
      # (`-C instrument-coverage`) produce genuinely different artefacts, and a
      # `shared-key` across them would thrash.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      # The opt-in `serve` feature builds vendored llama.cpp (ADR-0006), which
      # `--all-features` below pulls in. cmake + libclang (bindgen) are required;
      # the compiled artefacts are cached by rust-cache across runs.
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Dogfood (roteiro check)
        run: cargo run -p roteiro -- check
      # DO NOT "fix" this to match the deny step below. `cargo audit` reads
      # **Cargo.lock**, which lists every optional dependency regardless of which
      # features are on, so it already sees the whole feature matrix — it is
      # `cargo deny` that did not (#318). Measured: audit reports `ttf-parser`
      # (reachable only under the opt-in `pdf-text` feature) while `cargo deny
      # check` without `--all-features` said "no crate matched advisory criteria"
      # for the same crate. There is no `--all-features` to add here and it would
      # mean nothing if there were; ADR-0017 §3 records the measurement.
      # Kept as the RustSec-native second opinion. Note it exits 0 on
      # `unmaintained` advisories, so `cargo deny check advisories` — which exits
      # 1 on them — is the enforcing gate of the two.
      - name: Audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # `--all-features` is what closes #318: without it the licence and advisory
      # checks only saw the default build, and everything behind `models`,
      # `serve`, `pdf-text`, `image-vision`, `audio-transcribe` … was unchecked.
      # It is a *metadata* resolution, not a build — cargo-deny never compiles
      # anything — so this does **not** build llama.cpp or the tree-sitter
      # grammars and costs under a second on top of the install (ADR-0017).
      - name: Deny (licenses, bans, advisories) across the feature matrix
        run: |
          cargo install cargo-deny --locked
          cargo deny --all-features check

  # The DEFAULT feature set — the configuration every user installs, and until
  # this job existed the one configuration CI never built.
  #
  # `checks` above is `--all-features` throughout. That is the right scope for
  # the licence/advisory gates, which must see everything the project *ships*,
  # but it means the build a `cargo install roteiro` user actually gets was
  # never compiled here. It had rotted: three `-D warnings` errors across two
  # crates that `--all-features` cannot see, because they are artefacts of code
  # being cfg'd *out* (an emptied test crate losing its `//!` header; helpers
  # left behind when their only callers are gated away). Turning more features
  # on can never find that class of defect. Only building with them off can.
  #
  # REQUIRED, not advisory. Contrast `coverage` below, which is deliberately
  # `continue-on-error` because no threshold has been agreed and it would fail
  # on day one — an observation, not yet a rule. This job has no such excuse: it
  # is green as of the commit that adds it, so gating costs nothing today and is
  # the only thing that stops it going red unnoticed tomorrow. An advisory
  # version would reproduce the exact failure it exists to prevent — a signal
  # nobody is obliged to read.
  #
  # It needs cmake + libclang, and that is worth understanding before anyone
  # "tidies" the install step away as a copy-paste from `checks`. It is NOT
  # because the default *library* build pulls llama.cpp — it does not; the
  # `llama` feature is off by default exactly so downstream default builds stay
  # pure-Rust. It is because `--all-targets` compiles test targets, which pulls
  # dev-dependencies, and `rto-llama` declares a NON-optional dev-dependency on
  # `llama-cpp-2`. So `llama-cpp-sys-2` builds vendored llama.cpp here even at
  # the default feature set. (`cargo tree --edges normal,dev -i llama-cpp-sys-2`
  # shows the one path: llama-cpp-2 → [dev] rto-llama.) The comment on that
  # dev-dependency calls it "inert unless a test that uses it is compiled" — true
  # of linking, not of building, and this job is where the difference shows up.
  #
  # `cargo build`/`cargo install` at the default set genuinely needs none of
  # this; the cost is confined to `--all-targets`.
  #
  # protoc and the sandbox runtime are NOT needed and deliberately absent:
  # `exec-boxlite` is off in `rto-exec`'s default set, so nothing here trips
  # `rto-exec/build.rs`'s BOXLITE_RUNTIME_URL requirement.
  default-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      # A failed run must still save its cache, as above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install C/C++ toolchain (`rto-llama` dev-dependency, see above)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # rustfmt does not evaluate `cfg`, so this cannot differ from the `checks`
      # job's formatting step. Kept anyway: it costs seconds, and it makes this
      # job a complete statement of "the default set is healthy" rather than one
      # that quietly depends on another job having run.
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` because plain `cargo test` stops at the first failing
      # test binary, which makes the aggregate pass/fail counts a lower bound
      # rather than a measurement. A run that reports every failure is worth the
      # extra minutes when the whole point of the job is to find out what state
      # this feature set is in.
      - name: Test (default features)
        run: cargo test --workspace --no-fail-fast

  # Test coverage — MEASURING, NOT BLOCKING (issue #319).
  #
  # The docs asserted for a long time that `cargo-llvm-cov` ran here with an 85%
  # per-file floor. It did not: nothing in this file mentioned coverage at all,
  # so every stage DoD citing "85% coverage" was unverifiable. This job makes the
  # number real. It deliberately does NOT enforce a threshold yet.
  #
  # Why measure before gating: a *per-file* floor is stricter than most projects
  # run, and switching one on blind would immediately fail thin wiring files that
  # nobody wants to pad with ceremonial tests. The real numbers are what makes a
  # threshold decision possible. Turning the floor on is a separate, deliberate
  # change — `cargo llvm-cov --fail-under-lines N` (workspace) is the knob, and
  # a genuine per-file floor needs a check over the per-file table below.
  #
  # `continue-on-error` keeps a coverage regression from blocking a merge while
  # the number is only being observed. Remove it in the same change that adds a
  # threshold, not before — a job that can fail but is ignored is the same class
  # of untruth this job exists to end.
  #
  # Scope: `--all-features`, matching the `checks` job, so the measured surface
  # is the surface that is tested. That builds vendored llama.cpp (`serve`), so
  # the same apt packages are needed; rust-cache carries the artefacts between
  # runs. If this ever proves too slow to keep, narrow it to default features and
  # SAY SO in the summary — a partial measurement reported as partial is honest,
  # a gate that times out is not.
  coverage:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      # A failed run must still save its cache, as above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2.86.1
        with:
          tool: cargo-llvm-cov
      - name: Measure coverage (per file + workspace total)
        run: |
          cargo llvm-cov --workspace --all-features \
            --ignore-filename-regex '(tests?/|/target/)' \
            --summary-only | tee coverage-summary.txt
      - name: Report the numbers that a threshold decision needs
        if: always()
        run: |
          {
            echo '## Test coverage (measuring only — no gate)'
            echo
            echo 'The 85% per-file floor is **not** enforced. These numbers are'
            echo 'the input to deciding whether it should be.'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the full per-file report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage-summary.txt
          if-no-files-found: warn

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.94"
      # A failed run must still save its cache, as above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Install C/C++ toolchain (llama.cpp, `serve` feature)
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev
      # `--all-features` now includes `exec-boxlite` (ADR-0014, Stage 24), which
      # brings two build requirements that are real and not optional.
      #
      # `protoc` is needed by `boxlite-shared`'s build script unconditionally —
      # there is no stub path around it.
      #
      # The sandbox runtime is a prebuilt archive that `boxlite`'s build script
      # would otherwise fetch with an unverified `curl` and embed in the binary.
      # This provisions it from the digests pinned in
      # `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
      # boxlite's own fetch resolves to a local, verified file and never reaches
      # the network.
      #
      # The build no longer *requires* it — `rto-exec/build.rs` verifies the files
      # boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
      # keeps provisioning deliberately, for two reasons: it is the strict,
      # no-egress path and something should exercise it on every run, and it takes
      # a 26 MB download out of three jobs' critical path. Do not remove this on
      # the grounds that the build now works without it.
      - name: Install protoc (`exec-boxlite` feature)
        run: sudo apt-get install -y protobuf-compiler
      - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
        run: python3 scripts/provision-sandbox-runtime.py --github-env
      - name: Build on MSRV
        run: cargo check --workspace --all-features
      - name: Audit on MSRV lockfile
        run: |
          cargo install cargo-audit --locked
          cargo audit
