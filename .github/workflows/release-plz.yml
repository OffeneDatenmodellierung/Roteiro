name: Release-plz

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches: [main]
  # Lets the release PR be *asked for*. The push trigger alone means a merge
  # that should have opened the PR can be missed for good — v1.24.0 was held by
  # disabling this workflow, and the merge that would have opened its release PR
  # happened during the hold, so re-enabling the workflow recovered nothing and
  # the release sat waiting on unrelated commits.
  #
  # This deliberately does NOT become a publish button: `release-plz-release`
  # below is gated to the push path, because opening a PR and pushing to
  # crates.io are not the same risk.
  workflow_dispatch:

jobs:
  # Opens/updates the release PR (version bumps + changelog) after each merge.
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Publishes to crates.io + creates git tags and GitHub releases when the
  # merged commit contains a version bump (i.e. the release PR was merged).
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    # crates.io publishing and tag creation stay merge-driven. Until
    # `workflow_dispatch` was added above, the merge path was the only way to
    # reach this job, and that was the entire guard — this job carried no
    # condition of its own. Now the guard is written down instead of implied.
    if: github.event_name == 'push'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
