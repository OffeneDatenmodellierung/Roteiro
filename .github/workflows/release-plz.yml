name: Release-plz

permissions:
  pull-requests: write
  contents: write
  # `release-plz-release` reads `.../commits/{sha}/check-runs` before it
  # publishes. An explicit `permissions:` block sets every scope it does not
  # name to `none`, so without this line that call is unauthorized — and because
  # the step runs under `set -euo pipefail`, the publish would refuse *every*
  # time rather than wait. Fail-closed, but a release that can never happen.
  checks: read

on:
  push:
    branches: [main]
  # Lets the release PR be *asked for*. The push trigger alone means a merge
  # that should have opened the PR can be missed for good — v1.24.0 was held by
  # disabling this workflow, and the merge that would have opened its release PR
  # happened during the hold, so re-enabling the workflow recovered nothing and
  # the release sat waiting on unrelated commits.
  #
  # This deliberately does NOT become a publish button: `release-plz-release`
  # below is gated to the push path, because opening a PR and pushing to
  # crates.io are not the same risk.
  workflow_dispatch:

jobs:
  # Opens/updates the release PR (version bumps + changelog) after each merge.
  release-plz-pr:
    name: Release PR
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned toolchain, `master` ref of the action; see the `checks` job in
      # `ci.yml` for why, and for what raising it involves. Bumped with the four
      # sites there, in one commit, never alone.
      #
      # This job only opens a PR, so the stakes are the modest ones: the version
      # bump and changelog it produces should be produced by the compiler the
      # rest of the pipeline agreed on. It is pinned mainly so that both jobs in
      # this file move together — a split where the PR job floats and the
      # publish job below does not is a difference nobody would remember.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98"
      - name: Run release-plz release-pr
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Publishes to crates.io + creates git tags and GitHub releases when the
  # merged commit contains a version bump (i.e. the release PR was merged).
  release-plz-release:
    name: Release
    runs-on: ubuntu-latest
    # crates.io publishing and tag creation stay merge-driven. Until
    # `workflow_dispatch` was added above, the merge path was the only way to
    # reach this job, and that was the entire guard — this job carried no
    # condition of its own. Now the guard is written down instead of implied.
    if: github.event_name == 'push'
    steps:
      # ## Publishing waits for CI on this exact commit (issue #473)
      #
      # Merging the release PR is a push to `main`, and that push starts CI and
      # this job **in parallel, in different workflows, with no dependency
      # between them**. Without this step a red `main` publishes: `cargo publish`
      # runs, and crates.io permits a yank but never a replacement.
      #
      # Branch protection does not close this. It proves the PR was green when
      # it was checked; it cannot prove the tree is green *now*. On 2026-08-27
      # `bisync` was yanked upstream and `main` went red with **no commit behind
      # the change** — a release merged in that window would have published from
      # a tree CI was about to reject, and every required check had passed.
      #
      # Polling rather than `workflow_run`: the trigger model stays as it is, the
      # dependency is legible in the file that depends on it, and the failure
      # mode is a job that waits and then refuses rather than a workflow that
      # silently never fires. It **fails closed** — a missing check, a cancelled
      # run, or a timeout all stop the publish, because "no answer" and "green"
      # must not be the same outcome here.
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required="checks default-features msrv no-default-features"
          deadline=$(( $(date +%s) + 45*60 ))
          while :; do
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs" \
                     --paginate --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // "")"')
            pending=0
            for name in $required; do
              line=$(printf '%s\n' "$runs" | awk -F'\t' -v n="$name" '$1==n {print; exit}')
              if [ -z "$line" ]; then
                echo "waiting: '$name' has not reported yet"
                pending=1
                continue
              fi
              status=$(printf '%s' "$line" | cut -f2)
              conclusion=$(printf '%s' "$line" | cut -f3)
              if [ "$status" != "completed" ]; then
                echo "waiting: '$name' is $status"
                pending=1
              elif [ "$conclusion" != "success" ]; then
                echo "::error::'$name' concluded '$conclusion' on ${SHA} — refusing to publish."
                exit 1
              fi
            done
            [ "$pending" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::CI did not complete within 45 minutes on ${SHA} — refusing to publish."
              exit 1
            fi
            sleep 30
          done
          echo "every required check is green on ${SHA}"
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinned toolchain, `master` ref of the action; see the `checks` job in
      # `ci.yml` for why, and for what raising it involves. Bumped with the four
      # sites there, in one commit, never alone.
      #
      # ## This is the most consequential toolchain site in the repository
      #
      # The next step runs `release-plz release`, which runs `cargo publish`.
      # Floating here meant a Rust release could change the compiler that builds
      # a crate shipped to crates.io — with no commit behind the change, and
      # *after* CI had already gone green under a different one.
      #
      # That is exactly the drift that turned `main` red overnight on
      # 2026-08-18, one step further downstream, and downstream is worse. A red
      # `main` is repaired by a commit. A published version is public and
      # immutable: crates.io permits a yank, never a replacement, so a crate
      # built by a compiler nobody chose stays on the registry, and the run that
      # vouched for it used a different one. "CI proved green under 1.98" is
      # only a claim about the artifact if the artifact was built under 1.98.
      #
      # So this tracks `checks` deliberately and must keep tracking it: what CI
      # proved is what gets published.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.98"
      - name: Run release-plz release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
