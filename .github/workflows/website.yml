name: Website

# The docs site is a build-output of the graph (`roteiro render docs`).
#
# - On a pull request, the `build` job renders the site as a guard, so a broken
#   `render docs` fails CI here rather than silently on deploy.
# - On push to `main`, the `deploy` job renders the site with a cached Rust
#   toolchain and Direct-Uploads it to Cloudflare Pages — moving the Rust build
#   off Cloudflare's build infra (the former Git-integration ran `build.sh`,
#   which installs Rust and compiles on every deploy).
#
# The `deploy` job is INERT until the owner opts in: it only runs on the
# canonical repo's `main` and only when the `CLOUDFLARE_API_TOKEN` secret is set.
# See website/README.md for the one-time setup (add the two secrets, pin the
# wrangler action to a SHA, and disable the Cloudflare Git-integration build so
# the site is not deployed twice).
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/adr/**"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/adr/**"
      - "docs/BUILD_PLAN.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build roteiro.dev
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build site
        run: ./website/build.sh

  deploy:
    name: Deploy roteiro.dev
    # Canonical repo's main only; the deploy step is further gated on the secret.
    if: github.event_name == 'push' && github.repository == 'OffeneDatenmodellierung/Roteiro'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Render site
        run: ./website/build.sh
      - name: Deploy to Cloudflare Pages (Direct Upload)
        # Skips cleanly until the owner adds the secret and enables this path.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        # TODO: pin to a commit SHA (repo convention) before enabling.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=roteiro --branch=main
