name: Website

# The live site is built and deployed by the Cloudflare Pages Git
# integration (build command ./website/build.sh, output website/dist).
# This workflow only guards that the site still assembles, so a broken
# build fails CI here rather than silently on Cloudflare.
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/adr/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/adr/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build roteiro.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build site
        run: ./website/build.sh
