name: Website

# The live site is built and deployed by the Cloudflare Pages Git
# integration (build command ./website/build.sh, output website/dist).
# This workflow only guards that the site still assembles, so a broken
# build fails CI here rather than silently on Cloudflare.
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/adr/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/adr/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build roteiro.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build site
        run: ./website/build.sh
