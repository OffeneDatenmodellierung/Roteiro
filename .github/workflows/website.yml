name: Website

on:
  # Deploy as part of every release of the umbrella crate…
  push:
    tags: ["roteiro-v*"]
  # …and on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy roteiro.dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build site
        run: ./website/build.sh
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=roteiro
