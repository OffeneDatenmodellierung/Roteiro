name: Website

# The docs site is a build-output of the graph (`roteiro render docs`).
#
# - On a pull request, the `build` job renders the site as a guard, so a broken
#   `render docs` fails CI here rather than silently on deploy.
# - On push to `main`, the `deploy` job renders the site with a cached Rust
#   toolchain and Direct-Uploads it to Cloudflare Pages — moving the Rust build
#   off Cloudflare's build infra (the former Git-integration ran `build.sh`,
#   which installs Rust and compiles on every deploy).
#
# The `deploy` job is INERT until the owner opts in: it only runs on the
# canonical repo's `main` and only when the `CLOUDFLARE_API_TOKEN` secret is set.
# See website/README.md for the one-time setup (add the two secrets and disable
# the Cloudflare Git-integration build so the site is not deployed twice).
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/adr/**"
      # Both archived build plans are served, so watch the directory
      # rather than one file — naming only BUILD_PLAN.md left an edit
      # to BUILD_PLAN_V2.md unable to trigger a deploy.
      - "docs/history/**"
      - ".github/workflows/website.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/adr/**"
      # Both archived build plans are served, so watch the directory
      # rather than one file — naming only BUILD_PLAN.md left an edit
      # to BUILD_PLAN_V2.md unable to trigger a deploy.
      - "docs/history/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

# Cancel a superseded run, but only when nobody wants its result. See the fuller
# reasoning on the same block in `ci.yml`; the short version is that a PR run's
# verdict is worthless once a newer commit exists, while a `push` run is a record
# and a `workflow_dispatch` run was asked for by hand.
#
# The stakes are higher here than in `ci.yml`, which is why this is an expression
# and not `true`: on `push` this workflow's `deploy` job Direct-Uploads the site
# to Cloudflare Pages. Cancelling that mid-upload risks a half-published site,
# and no runner saving is worth that. `pull_request` only reaches the `build`
# job, which renders the site as a guard and produces nothing outside the runner
# — entirely safe to discard.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build roteiro.dev
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96"
      # A failed run must still save its cache; see the `checks` job in `ci.yml`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Build site
        run: ./website/build.sh

  deploy:
    name: Deploy roteiro.dev
    # Canonical repo's main only. The secret is NOT checked here: GitHub forbids
    # the `secrets` context in a job-level `if`, which made the whole workflow
    # fail to start. The deploy *step* below is gated on the secret (via `env`),
    # so it skips cleanly when the owner has not opted in.
    if: github.event_name == 'push' && github.repository == 'OffeneDatenmodellierung/Roteiro'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96"
      # A failed run must still save its cache; see the `checks` job in `ci.yml`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Render site
        run: ./website/build.sh
      - name: Deploy to Cloudflare Pages (Direct Upload)
        # Skips cleanly until the owner adds the secret and enables this path.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website/dist --project-name=roteiro --branch=main
