# The two build requirements `--all-features` brings with `exec-boxlite`
# (ADR-0014, Stage 24), shared by the `checks`, `coverage` and `msrv` jobs in
# `ci.yml`. They used to be three hand-copied pairs of steps whose apt error
# messages had already drifted apart; one definition cannot drift.
#
# Requires `actions/checkout` to have run first: a local action is read from the
# workspace, and the provisioning script is run from it.
#
# BOUND IT AT THE CALLER. Composite-action steps do not accept
# `timeout-minutes`, so the step-level bound on the apt fetch lives on the
# `uses:` step in `ci.yml`, and `ci_job_timeouts.rs` follows local actions to
# enforce it there.
#
# `protoc` is needed by `boxlite-shared`'s build script unconditionally —
# there is no stub path around it.
#
# This one IS a real install and stays: `protoc` is genuinely absent from
# `ubuntu-24.04` (`which protoc` finds nothing on a clean runner), unlike
# the cmake/clang/libclang step that used to sit above it in `ci.yml`.
#
# It runs WITHOUT a preceding `apt-get update`, which is not an oversight
# left behind when that step went: the runner image ships populated
# `/var/lib/apt/lists`, and `apt-get install -y protobuf-compiler` on a
# clean runner with no update at all resolved 3048 kB and finished in
# 5.07s. Measured, not assumed — an `update` is a full index refresh from
# the mirror and by far the more likely half to stall, so not needing it
# removes most of what remains of this hang surface.
#
# The sandbox runtime is a prebuilt archive that `boxlite`'s build script
# would otherwise fetch with an unverified `curl` and embed in the binary.
# This provisions it from the digests pinned in
# `crates/rto-exec/src/runtime_pins.rs` and exports BOXLITE_RUNTIME_URL, so
# boxlite's own fetch resolves to a local, verified file and never reaches
# the network.
#
# The build no longer *requires* it — `rto-exec/build.rs` verifies the files
# boxlite extracted against per-file pins either way (ADR-0014 v1.3). CI
# keeps provisioning deliberately, for two reasons: it is the strict,
# no-egress path and something should exercise it on every run, and it takes
# a 26 MB download out of three jobs' critical path. Do not remove this on
# the grounds that the build now works without it.
name: Provision the exec-boxlite build
description: Install protoc and provision the pinned sandbox runtime (exports BOXLITE_RUNTIME_URL).
runs:
  using: composite
  steps:
    - name: Install protoc (`exec-boxlite` feature)
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y protobuf-compiler \
          || { echo "::error::apt-get failed while installing protobuf-compiler. This is often a transient mirror/network issue; re-run the job. See the apt output above for the exact failure."; exit 1; }
    - name: Provision the pinned sandbox runtime (`exec-boxlite` feature)
      shell: bash
      run: python3 scripts/provision-sandbox-runtime.py --github-env
