[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "ISC"]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
ignore = [
    # `paste` (build-time-only proc-macro) is unmaintained but has no known
    # vulnerability. It enters the tree only via candle → gemm under the
    # optional `inference-local-models` feature; the default/`inference` builds
    # never pull it. Revisit if gemm/candle drop the dependency.
    "RUSTSEC-2024-0436",
]
