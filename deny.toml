# cargo-deny configuration — the licence, advisory and ban gates (ADR-0017).
#
# CI runs this with `--all-features` (`.github/workflows/ci.yml`), so the gate
# sees every optional feature the project ships, not just the default build.
# Widening it is what closed #318; before that, anything reachable only through
# `models`, `serve`, `pdf-text`, `image-vision`, `audio-transcribe` and friends
# was invisible to both the licence and the advisory check.

[licenses]
# Every entry up to "ISC" is a permissive **software** licence.
#
# `CDLA-Permissive-2.0` is admitted by **decision, not oversight** (ADR-0017,
# "Gates that see what the project actually ships"), and this comment is the
# record a future reader is owed:
#
# * It entered for **`webpki-roots`** — Mozilla's CA root store, pulled in by
#   `ureq` under the opt-in `models` feature, which is what fetches GGUF models
#   with consent. It is the trust anchor for those HTTPS downloads.
# * **It licenses data, not code.** The crate is a single generated `src/lib.rs`
#   that is a table of CA certificates derived from the Common CA Database; the
#   crate's own README states the data "is used via the CCADB Data Usage Terms"
#   and "is a derived work of the CCADB data". There is no library to speak of.
# * **CDLA-Permissive-2.0 is not copyleft.** Unlike MPL-2.0 — the one other
#   non-standard-permissive entry the project has weighed — it carries no
#   share-alike or reciprocal obligation. §3.1 is explicit that the agreement
#   "does not impose any restriction or obligations with respect to the use,
#   modification, or sharing of Results", and Results include anything computed
#   from the data. Roteiro's own MIT OR Apache-2.0 licensing is unaffected.
# * **The one obligation is attribution-shaped**: §2.1 requires that a recipient
#   who shares the Data includes the text of the agreement with it. The crate
#   ships that text in its `LICENSE` file, so a binary that vendors the crate
#   satisfies it the same way it satisfies MIT/BSD notice retention.
# * **The alternative was considered and rejected.** Dropping it means dropping
#   `ureq`'s default `rustls` roots for a platform verifier or `native-tls` —
#   trading a permissive data licence for a larger native-TLS surface, or for
#   platform-dependent trust behaviour, on the one code path whose entire job is
#   to verify a download. That is a worse security outcome, not a better one.
#
# Revisit if `webpki-roots` relicenses, if the obligation in §2.1 stops being
# satisfiable by shipping the crate's `LICENSE`, or if the `models` feature stops
# needing a bundled root store.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
# **Every `ignore` entry states four things** (ADR-0017, "Advisory exceptions
# carry their reasoning"). An entry without them is incomplete and should be
# rejected in review:
#
#   1. *why* the advisory is tolerable — normally "unmaintained, no known
#      vulnerability", never "it was noisy";
#   2. *how the crate enters the tree* — which feature and which parent, so the
#      blast radius is legible;
#   3. *what would trigger a revisit* — the condition that makes this stale;
#   4. *whether the justification is feature-scoped*, because `cargo deny` cannot
#      scope an ignore to a feature. A feature-scoped rationale is a promise the
#      tool cannot keep, and the entry must say so out loud.
#
# Ignores are for **advisories**, never for licences: a licence outside the
# allow-list above is a decision, not an exception.
ignore = [
    # `ttf-parser` is unmaintained (author-declared, no known vulnerability). It
    # enters the tree only via pdf-extract → lopdf under the optional `pdf-text`
    # feature; the default and `inference*` builds never pull it. It is a mature,
    # widely-used font parser. NOTE: cargo-deny cannot scope an advisory ignore to
    # a feature, so this ignore is global — if `ttf-parser` (or a future, more
    # serious advisory on it) ever enters via a non-`pdf-text` path, it would be
    # silenced too. Acceptable while the only edge is the opt-in feature and the
    # advisory is unmaintained-only; revisit if either changes, or if lopdf drops
    # or replaces the dependency.
    "RUSTSEC-2026-0192",
]
