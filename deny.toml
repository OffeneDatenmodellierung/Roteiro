[licenses]
# Every entry up to "ISC" is permissive. `MPL-2.0` is not, and it is here by
# **decision, not oversight** — ADR-0016 admits it, and this comment is the record
# a future reader is owed:
#
# * It entered for **`symphonia`** (ADR-0016): all seven `symphonia-*` crates are
#   MPL-2.0. They provide the audio *format* read — codec, rate, bit depth,
#   channels, duration, tags — behind the opt-in `audio-metadata` feature. Every
#   transitive dependency they pull (`lazy_static`, `log`, `bitflags`, `bytemuck`,
#   `smallvec`, `num-complex`, `num-traits`, `regex-lite`, `extended`) was already
#   inside this allow-list, so MPL-2.0 was the sole addition.
# * MPL-2.0 is **file-level (weak) copyleft**: the obligation attaches to the
#   MPL-licensed *files themselves*. Modifying one obliges publishing that file's
#   modifications; shipping binaries obliges the notice and the availability of
#   those files' source. Using the crate unmodified — the expected and current
#   case — reduces the obligation to keeping the notice.
# * It therefore **does not reach Roteiro's own source**. Linking an MPL-2.0 crate
#   does not license this repository under MPL-2.0, and the project's
#   `MIT OR Apache-2.0` dual licence is untouched.
#
# If a *second* MPL-2.0 crate ever appears in the tree, re-run that reasoning for
# it — this entry blessed a considered case, not the licence in general.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib", "ISC", "MPL-2.0"]

[bans]
multiple-versions = "warn"

[advisories]
yanked = "deny"
ignore = [
    # `paste` (build-time-only proc-macro) is unmaintained but has no known
    # vulnerability. It enters the tree only via candle → gemm under the
    # optional `inference-local-models` feature; the default/`inference` builds
    # never pull it. Revisit if gemm/candle drop the dependency.
    "RUSTSEC-2024-0436",
    # `ttf-parser` is unmaintained (author-declared, no known vulnerability). It
    # enters the tree only via pdf-extract → lopdf under the optional `pdf-text`
    # feature; the default and `inference*` builds never pull it. It is a mature,
    # widely-used font parser. NOTE: cargo-deny cannot scope an advisory ignore to
    # a feature, so this ignore is global — if `ttf-parser` (or a future, more
    # serious advisory on it) ever enters via a non-`pdf-text` path, it would be
    # silenced too. Acceptable while the only edge is the opt-in feature and the
    # advisory is unmaintained-only; revisit if either changes, or if lopdf drops
    # or replaces the dependency.
    "RUSTSEC-2026-0192",
]
