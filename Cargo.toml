[workspace]
resolver = "3"
members = [
    "crates/rto-exec",
    "crates/rto-faithful",
    "crates/rto-graph",
    "crates/rto-llama",
    "crates/rto-spec",
    "crates/rto-render",
    "crates/rto-serve",
    "crates/rto-okf-syntax",
    "crates/roteiro",
]

[workspace.package]
version = "7.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OffeneDatenmodellierung/Roteiro"
homepage = "https://roteiro.dev"
authors = ["The Roteiro Project Team"]

[workspace.dependencies]
rto-exec = { path = "crates/rto-exec", version = "7.1.0" }
rto-faithful = { path = "crates/rto-faithful", version = "7.1.0" }
rto-graph = { path = "crates/rto-graph", version = "7.1.0" }
rto-llama = { path = "crates/rto-llama", version = "7.1.0" }
# Versioned independently of the workspace — see its own manifest for why.
rto-okf-syntax = { path = "crates/rto-okf-syntax", version = "0.1.2" }
rto-spec = { path = "crates/rto-spec", version = "7.1.0" }
rto-render = { path = "crates/rto-render", version = "7.1.0" }
rto-serve = { path = "crates/rto-serve", version = "7.1.0" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
# Held on 0.39 for a long time by two constraints, both gone: libsqlite3-sys's
# build script needed Rust 1.95 (MSRV is now 1.96), and `boxlite` required
# `rusqlite ^0.39` (`links = "sqlite3"` admits one copy per graph) until
# ADR-0030 removed it. 0.41 bundles SQLite 3.54.x, which fixes CVE-2026-119375
# (RUSTSEC-2026-0459). Not 0.42: it is younger than the 48-hour minimum release
# age (ADR-0017).
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Broken intra-doc links, denied — issue #783. Here rather than in a
# `RUSTDOCFLAGS` invocation for the reason `unsafe_code` is here: a lint in the
# manifest travels with the crate, so it holds for anyone who runs `cargo doc`
# rather than only for the one job that remembers the flag.
#
# `private_intra_doc_links` is the larger half of what #783 found — 50 of the
# first 72 — and it is the half that reaches a reader: the item resolves while
# you are writing it and renders as dead text on docs.rs, where the private
# half of the crate does not exist.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
