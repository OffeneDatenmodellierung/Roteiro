[workspace]
resolver = "3"
members = [
    "crates/rto-graph",
    "crates/rto-llama",
    "crates/rto-spec",
    "crates/rto-render",
    "crates/rto-serve",
    "crates/roteiro",
]

[workspace.package]
version = "1.9.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OffeneDatenmodellierung/Roteiro"
homepage = "https://roteiro.dev"
authors = ["The Roteiro Project Team"]

[workspace.dependencies]
rto-graph = { path = "crates/rto-graph", version = "1.9.1" }
rto-llama = { path = "crates/rto-llama", version = "1.9.1" }
rto-spec = { path = "crates/rto-spec", version = "1.9.1" }
rto-render = { path = "crates/rto-render", version = "1.9.1" }
rto-serve = { path = "crates/rto-serve", version = "1.9.1" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
# Pinned to 0.39 (not the latest 0.40.x): libsqlite3-sys's build script from
# 0.38.0 onward uses the std `cfg_select!` macro, stabilized in Rust 1.95 —
# newer than our 1.94 MSRV, which breaks the `bundled` feature's build.rs on
# our MSRV toolchain. Revisit this pin if/when the project MSRV moves to
# 1.95+ (see ADR-0001 for MSRV policy).
rusqlite = { version = "=0.39.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
