[workspace]
resolver = "3"
members = [
    "crates/rto-graph",
    "crates/rto-spec",
    "crates/rto-render",
    "crates/roteiro",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OffeneDatenmodellierung/Roteiro"
homepage = "https://roteiro.dev"
authors = ["The Roteiro Project Team"]

[workspace.dependencies]
rto-graph = { path = "crates/rto-graph", version = "0.0.1" }
rto-spec = { path = "crates/rto-spec", version = "0.0.1" }
rto-render = { path = "crates/rto-render", version = "0.0.1" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
