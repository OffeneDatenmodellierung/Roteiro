[workspace]
resolver = "3"
members = [
    "crates/rto-exec",
    "crates/rto-faithful",
    "crates/rto-graph",
    "crates/rto-llama",
    "crates/rto-spec",
    "crates/rto-remote",
    "crates/rto-render",
    "crates/rto-serve",
    "crates/rto-okf-syntax",
    "crates/roteiro",
]

[workspace.package]
version = "5.11.1"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OffeneDatenmodellierung/Roteiro"
homepage = "https://roteiro.dev"
authors = ["The Roteiro Project Team"]

[workspace.dependencies]
rto-exec = { path = "crates/rto-exec", version = "5.11.1" }
rto-faithful = { path = "crates/rto-faithful", version = "5.11.1" }
rto-graph = { path = "crates/rto-graph", version = "5.11.1" }
rto-llama = { path = "crates/rto-llama", version = "5.11.1" }
# Versioned independently of the workspace — see its own manifest for why.
rto-okf-syntax = { path = "crates/rto-okf-syntax", version = "0.1.1" }
rto-remote = { path = "crates/rto-remote", version = "5.11.1" }
rto-spec = { path = "crates/rto-spec", version = "5.11.1" }
rto-render = { path = "crates/rto-render", version = "5.11.1" }
rto-serve = { path = "crates/rto-serve", version = "5.11.1" }
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
# Pinned to 0.39 (not the latest 0.40.x). TWO constraints held it here and
# only one of them has lifted.
#
# The first was an MSRV blocker: libsqlite3-sys's build script from 0.38.0
# onward uses the std `cfg_select!` macro, stabilized in Rust 1.95 — newer
# than the 1.94 MSRV in force at the time, which broke the `bundled`
# feature's build.rs. That one is **gone** as of the 1.96 MSRV.
#
# The second still stands and is not ours to lift: `boxlite` 0.10.0 requires
# `rusqlite ^0.39`, and `libsqlite3-sys` declares `links = "sqlite3"`, so the
# graph admits exactly one version of it. Under `--all-features` (which turns
# on `exec-boxlite`) moving to 0.40 is therefore a resolution conflict, not a
# choice — boxlite has to move first.
#
# So this is a dependency-upgrade task gated on an upstream crate, NOT an
# MSRV-gated one. Do not re-file it under the MSRV (see ADR-0001 for that).
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Broken intra-doc links, denied — issue #783. Here rather than in a
# `RUSTDOCFLAGS` invocation for the reason `unsafe_code` is here: a lint in the
# manifest travels with the crate, so it holds for anyone who runs `cargo doc`
# rather than only for the one job that remembers the flag.
#
# `private_intra_doc_links` is the larger half of what #783 found — 50 of the
# first 72 — and it is the half that reaches a reader: the item resolves while
# you are writing it and renders as dead text on docs.rs, where the private
# half of the crate does not exist.
[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_html_tags = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
