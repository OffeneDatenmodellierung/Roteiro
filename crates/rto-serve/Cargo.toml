[package]
name = "rto-serve"
description = "Roteiro local model serving: an opt-in, loopback, OpenAI-compatible /v1 endpoint over installed models (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# The llama.cpp inference engine (ADR-0006). Opt-in: pulls a C/C++ toolchain
# (cmake, clang, libclang) to build vendored llama.cpp. The crate's pure-Rust
# core (types, `Engine` trait, the `/v1` server) builds and tests without it.
llama-cpp-2 = { version = "0.1.154", optional = true }
# Incremental UTF-8 decode for `token_to_piece` (multi-byte tokens split across
# decode steps). Already in the tree via `llama-cpp-2`; only pulled with `llama`.
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# The real llama.cpp-backed engine. Off by default so the default build stays
# pure-Rust; `roteiro`'s `serve` feature turns it on.
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[lints]
workspace = true
