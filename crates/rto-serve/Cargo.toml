[package]
name = "rto-serve"
description = "Roteiro local model serving: an opt-in, loopback, OpenAI-compatible /v1 endpoint over installed models (ADR-0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The llama.cpp inference core (the `Engine` trait + `LlamaEngine`). The `llama`
# feature turns on the real C++ engine (ADR-0006).
rto-llama = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
# Decode `image_url` data-URIs (base64) in multimodal chat requests.
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# The real llama.cpp-backed engine. Off by default so the default build stays
# pure-Rust; `roteiro`'s `serve` feature turns it on.
llama = ["rto-llama/llama"]

[lints]
workspace = true
