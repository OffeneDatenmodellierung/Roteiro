[package]
name = "rto-serve"
description = "Roteiro local model serving: an opt-in, loopback, OpenAI-compatible /v1 endpoint over installed models (ADR-0006)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The llama.cpp inference core (the `Engine` trait + `LlamaEngine`). The `llama`
# feature turns on the real C++ engine (ADR-0006).
rto-llama = { workspace = true }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tokio-stream = "0.1"
# Decode `image_url` data-URIs (base64) in multimodal chat requests.
base64 = "0.23"
# `tls` only: in-app TLS termination (ADR-0002 follow-up). `tls-rustls-no-provider`
# deliberately does NOT bundle a crypto provider, so we install *ring* explicitly
# (below) — the same backend already in the tree via `ureq`, avoiding a second,
# heavier `aws-lc-rs` C backend and its extra licence surface.
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
], optional = true }
# `tls` only: install the ring `CryptoProvider` before building the server config.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[features]
# The real llama.cpp-backed engine. Off by default so the default build stays
# pure-Rust; `roteiro`'s `serve` feature turns it on.
llama = ["rto-llama/llama"]
# In-app TLS termination via rustls (ADR-0002 follow-up): serve HTTPS directly
# instead of requiring a reverse proxy. Uses the ring provider (already vetted in
# the tree); off by default.
tls = ["dep:axum-server", "dep:rustls"]

[lints]
workspace = true
