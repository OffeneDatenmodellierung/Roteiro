[package]
name = "rto-exec"
description = "Analyzer execution contract for Roteiro: one normalized findings result whether ingested from a CI report or produced by a future sandboxed run. Implementation detail of the roteiro CLI; no API stability guarantee."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
rto-graph = { workspace = true }
# `exec-boxlite` only: OCI images in microVMs (ADR-0014). **Pinned exactly**, per
# the ADR's maturity duties — this is pre-1.0 code with two critical advisories
# fixed in 0.9.0, and a caret range on it would be a floating security boundary.
#
# Default features on purpose. The `krun` feature does not work from crates.io:
# `libkrun-sys` excludes its vendored sources from the published package, so
# enabling it compiles the FFI declarations and then fails to link with 26
# undefined symbols. What actually executes is the prebuilt runtime — see
# `src/runtime_pins.rs` — which `build.rs` refuses to build against unless it has
# been provisioned and verified against a pinned digest.
#
# Bumping this version bumps the sandbox runtime with it: `RUNTIME_VERSION`,
# the three archive pins and every per-file digest in `runtime_file_pins.rs`
# move together, and `tests/runtime_pin_integrity.rs` fails the build if they
# do not. Re-derive with `scripts/derive-runtime-file-pins.py`, never by hand.
boxlite = { version = "=0.10.2", optional = true }
# `exec-boxlite` only: **a pin, not a use.** Nothing in this crate names
# `boxlite_shared`; this entry exists solely to hold it at the version `boxlite`
# was built and tested against. **Do not delete it as an unused dependency** —
# deleting it re-opens the break below for everyone who installs without
# `--locked`.
#
# Why the pin above is not enough: `=0.10.2` pins `boxlite`, but *not* what
# `boxlite` itself depends on. Every `boxlite` release to date requires its
# sibling with a **caret** — 0.10.0 asks for `boxlite-shared = "0.10.0"`, and
# 0.10.2 asks for `"0.10.2"` — so a fresh resolution is free to float the
# sibling while our exact pin holds the parent still. That is not hypothetical:
# it is exactly how `cargo install roteiro --features exec-boxlite` broke on
# 6.0.1. `boxlite-shared` 0.10.1 added a required sixth field, `source_is_dir`,
# to the `UploadChunk` protobuf message (`proto/boxlite/v1/service.proto:569`);
# `boxlite` 0.10.0's struct literal (`src/portal/interfaces/files.rs:51`) still
# listed five, and the mismatched pair does not compile:
#
#     error[E0063]: missing field `source_is_dir` in initializer of `UploadChunk`
#
# The two crates are two halves of one prost-generated API released in lockstep,
# and upstream ships required fields on public structs in **patch** releases, so
# a caret between them is a semver break waiting to happen. Bumping `boxlite` to
# 0.10.2 fixes today's mismatch; this line is what stops 0.10.3 causing the next
# one. Keep the two versions equal. ADR-0014 v1.9 records the duty.
boxlite-shared = { version = "=0.10.2", optional = true }
# `exec-boxlite` only: `AnalyzerRunner::run` is synchronous and boxlite's API is
# async, so the runner drives a current-thread runtime it owns. No reactor is
# shared with the CLI, and nothing here spawns a background thread.
tokio = { version = "1", features = ["rt"], optional = true }
# `exec-boxlite` only: boxlite streams a command's stdout/stderr as `Stream`s.
futures = { version = "0.3", optional = true }
# The sandbox image store's index (`sandbox_store`). The name -> digest mapping
# `roteiro sandbox status|clear` needs lives only in `boxlite`'s own SQLite
# database, and there is no filesystem-only route to it — see the module.
#
# Ungated, like `assets`, and for the same kind of reason: reclaiming 8.5 GB a
# previous build cached must not require rebuilding with the backend that cached
# it. Adds an edge, not a crate: `rto-graph` is already a dependency and already
# depends on this exact workspace pin.
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Digest of the raw report, which is part of an `AnalysisRun`'s evidence chain:
# it ties the stored findings to the exact bytes they were derived from. Already
# in the workspace tree (rto-graph's `models` feature uses the same 0.11 pin), so
# this adds an edge to the dependency graph, not a new crate to the lockfile.
# Pure Rust, MIT OR Apache-2.0, on the `cargo deny` allow-list.
sha2 = "0.11"

[features]
default = []
# The subprocess backend (ADR-0014's explicit escape hatch) — and **only** the
# backend. Asset provisioning used to sit behind this feature too; it no longer
# does, because provisioning executes nothing and gating it here made
# bootstrapping `exec-boxlite` circular. See the note on `pub mod assets`.
#
# This feature is now the whole of what "can execute a third-party binary on the
# host" means in this crate: it is what compiles `subprocess.rs`, and every
# `Command::new` outside `boxlite.rs` is in that file. It is off by default
# *here*; note that the `roteiro` CLI does enable it in its own default set, so
# the run-time consent gate (`--allow-unsandboxed`) is what stands between a
# stock install and an unsandboxed run. Adds no third-party dependency —
# `std::process` and the crates already here.
exec-subprocess = []
# The sandboxed backend (ADR-0014's reproducible local path): a digest-pinned OCI
# image in a microVM, a read-only worktree mount, a scrubbed environment and no
# egress. Off by default — it pulls a large native dependency closure and needs
# `protoc >= 3.12` on the build host.
#
# It does **not** imply `exec-subprocess`: the sandboxed and unsandboxed backends
# are independent choices, and enabling a boundary must never switch on the
# escape hatch that has none. It does share `assets`, which both gate on.
exec-boxlite = ["dep:boxlite", "dep:boxlite-shared", "dep:tokio", "dep:futures"]

[build-dependencies]
# `build.rs` verifies the provisioned sandbox runtime against the digest pinned
# in `src/runtime_pins.rs` before anything is built against it. Same crate and
# pin as the main dependency; adds no new crate to the lockfile.
sha2 = "0.11"

[lints]
workspace = true
