[package]
name = "rto-exec"
description = "Analyzer execution contract for Roteiro: one normalized findings result whether ingested from a CI report or produced by a local run. Implementation detail of the roteiro CLI; no API stability guarantee."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
rto-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Digest of the raw report, which is part of an `AnalysisRun`'s evidence chain:
# it ties the stored findings to the exact bytes they were derived from. Already
# in the workspace tree (rto-graph's `models` feature uses the same 0.11 pin), so
# this adds an edge to the dependency graph, not a new crate to the lockfile.
# Pure Rust, MIT OR Apache-2.0, on the `cargo deny` allow-list.
sha2 = "0.11"

[features]
default = []
# The subprocess backend (ADR-0014's explicit escape hatch, and since ADR-0030
# the only execution backend). Asset provisioning is not behind it: it executes
# nothing. See the note on `pub mod assets`.
#
# This feature is the whole of what "can execute a third-party binary on the
# host" means in this crate: it is what compiles `subprocess.rs` and `lint.rs`,
# and every `Command::new` is behind it. It is off by default *here*; note that
# the `roteiro` CLI does enable it in its own default set, so the run-time
# consent gate (`--allow-unsandboxed`) is what stands between a stock install
# and an unsandboxed run. Adds no third-party dependency — `std::process` and
# the crates already here.
exec-subprocess = []

[lints]
workspace = true
