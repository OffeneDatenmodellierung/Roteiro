[package]
name = "rto-llama"
description = "Roteiro's llama.cpp inference core: the Engine trait + a llama.cpp-backed engine (generation, embeddings, vision), shared by serving and internal uses (ADR-0003/0006)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
# The event facade for the one warning this crate raises itself: a
# configured context-window ceiling above what a model was trained for
# (issue #486). No new crate enters the build — `llama-cpp-2` already
# routes llama.cpp's native logs through `tracing`, and the binary
# installs the subscriber (ADR-0011); this only makes the facade a
# direct edge so the warning lands in the same place every other log does.
tracing = "0.1"
# The llama.cpp engine. Opt-in: pulls a C/C++ toolchain (cmake, clang, libclang)
# to build vendored llama.cpp. The pure-Rust `Engine` trait + request/result
# types build and are usable without it (e.g. mock engines, wire mappers).
#
# This entry serves the integration tests too, and that is the reason there is no
# `[dev-dependencies]` copy of it. Cargo passes a package's *normal* dependencies
# to its test targets as well as its dev-dependencies, so the four files in
# `tests/` that reach past `LlamaEngine`'s API to llama.cpp itself —
# `batch_numerics`, `batch_capacity`, `context_window`, `speculative` — can
# `use llama_cpp_2::…` whenever `llama` is on, and cannot when it is off. That is
# exactly right: every file in `tests/` is `#![cfg(feature = "llama")]`, so with
# the feature off there is nothing left to compile against it.
#
# A `[dev-dependencies]` entry did not have that property, because
# dev-dependencies are never feature-gated — Cargo rejects `optional` on one — so
# `--all-targets` built vendored llama.cpp at *every* feature set,
# `--no-default-features` included, and four CI jobs installed cmake/clang to
# compile a C++ tree none of their test targets could name (issue #483). The
# comment that stood here called it "inert unless a test that uses it is
# compiled": true of linking, false of building, and it misled two workers and an
# orchestrator before it was measured. `cargo build`/`cargo install` never paid
# it either way.
llama-cpp-2 = { version = "0.1.154", optional = true }
encoding_rs = { version = "0.8", optional = true }

[features]
# The real llama.cpp-backed engine. Off by default so downstream default builds
# stay pure-Rust; callers turn it on when they need local inference.
llama = ["dep:llama-cpp-2", "llama-cpp-2/mtmd", "dep:encoding_rs"]

[lints]
workspace = true
