[package]
name = "rto-render"
description = "Renderers for Roteiro: docs site, Obsidian vault, and optional MCP server. Implementation detail of the roteiro CLI; no API stability guarantee."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rto-graph = { workspace = true }
# `execution`-only: the shared `security list` / `security status` tool documents
# (`rto_exec::tool_security`), which the MCP `security_*` tools are thin wrappers
# over. Nothing here executes anything — the module is ungated in `rto-exec`
# precisely because a read owes its reader the same answer whichever analyzer
# backend was compiled in, and every `Command::new` in that crate is behind
# `exec-subprocess`/`exec-boxlite`, neither of which this enables.
rto-exec = { workspace = true, optional = true }
# The authored-layer parse and drift rule behind the MCP `check` tool. It is
# `mcp`-only: a default `rto-render` build renders documents and needs none of it.
rto-spec = { workspace = true, optional = true }
# MCP-only (feature `mcp`): the official Rust MCP SDK + async runtime + HTTP.
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"], optional = true }
axum = { version = "0.8", optional = true }
schemars = { version = "1", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
# A real YAML parser, used **only** to prove the frontmatter this crate emits
# parses back to the value it was given (`yaml_double_quoted` / `yaml_scalar`).
# Asserting the emitted bytes instead would pass just as happily on an escaper
# that is self-consistently wrong, which is the defect being fixed.
#
# Already in the tree — `rto-graph` depends on it non-optionally and `roteiro`
# does too — so this adds a dev-only edge, not a dependency. It is deliberately
# not a real dependency: `YamlEmitter` dumps a whole document with its own
# layout and cannot write one scalar into a hand-built block, so using it to
# emit would rewrite every note's frontmatter and break #442's byte-identity
# promise.
yaml-rust2 = "0.11.0"

[features]
# MCP server support (`roteiro serve`), off by default — CLI-first. Adopts rmcp
# (ADR-0002) for stdio + streamable-HTTP transports; entirely feature-gated so
# the default build pulls none of it.
mcp = ["dep:rmcp", "dep:rto-spec", "dep:tokio", "dep:axum", "dep:schemars", "dep:serde", "dep:serde_json"]
# The `security_list` / `security_status` MCP tools, which need `rto-exec`'s
# document types. Named `execution` to match the feature that carries the same
# surface in the `roteiro` binary, and forwarded from there — see that crate's
# `execution` entry — so the MCP surface and the served-chat surface gain and lose
# these two tools together. `both_tool_surfaces_offer_the_same_tools` is what
# fails if they ever come apart.
#
# It deliberately does **not** imply `mcp`, and the tools are gated on
# `all(mcp, execution)`. A default `rto-render` build renders documents; enabling
# this alone adds a dependency edge to a crate the `roteiro` default build already
# compiles, and no code at all.
execution = ["dep:rto-exec"]

[lints]
workspace = true
