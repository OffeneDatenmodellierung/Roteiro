[package]
name = "rto-render"
description = "Renderers for Roteiro: docs site, Obsidian vault, and optional MCP server. Implementation detail of the roteiro CLI; no API stability guarantee."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rto-graph = { workspace = true }
# `execution`-only: the shared `security list` / `security status` tool documents
# (`rto_exec::tool_security`), which the MCP `security_*` tools are thin wrappers
# over. Nothing here executes anything — the module is ungated in `rto-exec`
# precisely because a read owes its reader the same answer whichever analyzer
# backend was compiled in, and every `Command::new` in that crate is behind
# `exec-subprocess`/`exec-boxlite`, neither of which this enables.
rto-exec = { workspace = true, optional = true }
# The authored-layer parse and drift rule behind the MCP `check` tool. It is
# `mcp`-only: a default `rto-render` build renders documents and needs none of it.
rto-spec = { workspace = true, optional = true }
# MCP-only (feature `mcp`): the official Rust MCP SDK + async runtime + HTTP.
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "transport-io",
    "transport-streamable-http-server",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "net"], optional = true }
axum = { version = "0.8", optional = true }
schemars = { version = "1", optional = true }
# Ungated for the same reason `serde_json` below is: the OKF **reader**
# (`okf::read`, issue #706) reports what it imported and what it skipped, and a
# report is a `Serialize` type in every other importer in this workspace
# (`rto_spec::ImportReport`). Deriving it costs no new edge in the tree —
# `rto-graph` depends on serde non-optionally, so every build of this crate
# already compiles it — and hand-building the same JSON with `serde_json::json!`
# is the drift the derive exists to prevent.
serde = { workspace = true }
# The reader's error type. `rto-graph` and `rto-spec` both already use it for
# exactly this, and it is likewise already in every build of this crate.
thiserror = { workspace = true }
# Ungated because `tool_class::report` is, and it has to be: the class table and
# the document standing in for a withheld class are shared by BOTH tool surfaces
# (#664), and `serve` does not imply `mcp` — a serve-only build has no MCP module
# to read the shape from. Two hand-built copies of one JSON document is the drift
# `tool_text` already exists to prevent for descriptions. No new edge in the tree:
# `rto-graph` depends on serde_json non-optionally, so every build of this crate
# already compiles it.
serde_json = { workspace = true }
# The OKF format itself (ADR-0021), as somebody else's implementation.
#
# This replaces a hand-rolled YAML-subset reader *and* the general-purpose YAML
# parser that briefly stood in for it. The hand-rolled subset was shaped like
# the bundles this crate itself writes, and silently lost flow mappings, flow
# sequences, unindented block sequences and multi-line scalars — all ordinary
# YAML, all present in Google's published bundles. A general parser fixed the
# YAML and left the *format* still ours to re-derive: trust tiers, the actor
# convention, the bare-mapping shorthand §5.2 mandates. Those are the parts an
# interchange format exists to standardise, and re-deriving them is how two
# readers of one spec end up disagreeing.
#
# `okf-core` is a pure-Rust OKF v0.2 implementation by an author who is not us,
# which is the point: it is an independent reading of the same specification.
# It carries **zero dependencies** (verified against the crates.io index), so
# adopting it costs one crate in the lockfile and removes another
# (`yaml-rust2`, still non-optional in `rto-graph` and untouched there).
#
# Still **not** used to emit. Its emitter dumps a whole document with its own
# layout and cannot write one scalar into a hand-built block, so emitting
# through it would rewrite every note's frontmatter and break #442's
# byte-identity promise. The writer keeps its own escaper, and
# `a_scalar_round_trips_through_the_writers_escaper` now proves that escaper
# against *this* parser — a stronger proof than before, since this is the
# parser a peer would actually read our bundles with.
okf-core = "0.2.6"
# `okf-validate`-only: independent conformance checking and hygiene linting of a
# bundle (`roteiro okf validate` / `roteiro okf lint`).
#
# Gated because it is expensive and, unlike `okf-core`, its cost is not
# separable. Measured with `cargo tree -p rto-render -e normal`: the default
# tree is 161 crates and this feature takes it to 234, so the gate is worth
# **73 crates** — against **one** for `okf-core`, which is the whole reason the
# two are treated differently.
#
# They are a *parallel* stack rather than reuse. It syntax-checks fenced code
# blocks, parsing JavaScript/TypeScript with `oxc_parser` (15 `oxc_*` crates),
# Python with `rustpython-parser` and SQL with `sqlparser` — all three languages
# this workspace already parses, with tree-sitter. What overlap there is is
# generic plumbing (serde, syn, anyhow); nothing language-specific is shared.
#
# None of its dependencies is optional, so its conformance checking cannot be
# taken without its syntax checking. That is a property of the dependency, not a
# choice available to us.
okf-validator = { version = "0.2.6", optional = true }

[features]
# Independent validation of an OKF bundle: `roteiro okf validate` (conformance,
# against the specification) and `roteiro okf lint` (the L1..L12 hygiene rules).
# Off by default, for the dependency cost recorded on `okf-validator` above.
#
# **Named for the capability, not the crate**, matching `mcp` (which gates
# `rmcp`) and `execution` (which gates `rto-exec`). `validate` is the primary
# subcommand and the one worth naming; `lint` rides along because the two live
# in one crate with no feature separating them, so gating them apart would be a
# promise the dependency cannot keep — the same reasoning ADR-0017 §5 applies to
# a feature-scoped advisory ignore.
#
# Everything OKF that does **not** need this crate stays ungated: `roteiro okf
# trust`, `okf links` and `okf diff` are all `okf-core`, which costs nothing.
okf-validate = ["dep:okf-validator"]
# MCP server support (`roteiro serve`), off by default — CLI-first. Adopts rmcp
# (ADR-0002) for stdio + streamable-HTTP transports; entirely feature-gated so
# the default build pulls none of it.
mcp = ["dep:rmcp", "dep:rto-spec", "dep:tokio", "dep:axum", "dep:schemars"]
# The `security_list` / `security_status` MCP tools, which need `rto-exec`'s
# document types. Named `execution` to match the feature that carries the same
# surface in the `roteiro` binary, and forwarded from there — see that crate's
# `execution` entry — so the MCP surface and the served-chat surface gain and lose
# these two tools together. `both_tool_surfaces_offer_the_same_tools` is what
# fails if they ever come apart.
#
# It deliberately does **not** imply `mcp`, and the tools are gated on
# `all(mcp, execution)`. A default `rto-render` build renders documents; enabling
# this alone adds a dependency edge to a crate the `roteiro` default build already
# compiles, and no code at all.
execution = ["dep:rto-exec"]

[lints]
workspace = true
