[package]
name = "rto-graph"
description = "Provenance-tagged codebase knowledge graph store for Roteiro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# Pure-Rust git access for content-addressed extraction (blob/tree ids, tree
# walking, worktree status). `sha1` selects the pure-Rust hashing backend; we
# stay off default features to avoid pulling any network transports (offline).
gix = { version = "0.86.0", default-features = false, features = [
    "sha1",
    "status",
    "dirwalk",
    "revision",
] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# Also needed by the integration tests in `tests/`, which don't inherit the
# crate's normal dependencies.
serde_json = { workspace = true }

[lints]
workspace = true
