[package]
name = "rto-graph"
description = "Provenance-tagged codebase knowledge graph store for Roteiro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# Pure-Rust git access for content-addressed extraction (blob/tree ids, tree
# walking, worktree status). `sha1` selects the pure-Rust hashing backend; we
# stay off default features to avoid pulling any network transports (offline).
gix = { version = "0.86.0", default-features = false, features = [
    "sha1",
    "status",
    "dirwalk",
    "revision",
] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"

# `inference-local-models` only (candle BERT embedder + checksum). CPU-only —
# no cuda/metal/mkl features, so it builds on any CI box. See ADR-0003.
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"], optional = true }
sha2 = { version = "0.10", optional = true }

# `pdf-text` only: pure-Rust PDF text extraction (fonts/CMaps handled internally).
# Opt-in — pulls a large tree (lopdf + font/crypto parsers) that the default and
# `inference*` builds never contain. Extraction is panic-guarded (see extract.rs).
pdf-extract = { version = "0.12", optional = true }

# `image-ocr` only (ADR-0005 Tier A): pure-Rust OCR. `ocrs` runs detection +
# recognition on `rten`, a pure-Rust model runtime (no ONNX Runtime / tesseract /
# C++ FFI). `image` is pinned to minimal codecs — its default features pull an
# AVIF → libfuzzer-sys (NCSA) chain that is not on the `cargo deny` allow-list.
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

[dev-dependencies]
# Also needed by the integration tests in `tests/`, which don't inherit the
# crate's normal dependencies.
serde_json = { workspace = true }

[features]
# Offline similarity inference (the `inferred` provenance class). Adds no
# dependencies — the default embedding is a pure-Rust hashing embedding
# (ADR-0003).
inference = []
# The shared, candle-free model machinery (ADR-0003): the registry, per-platform
# variants, the on-disk model store, and SHA-256 verification. Enabled by every
# model tier (embedding, generative, OCR) so they share one registry and the
# `roteiro model` commands without pulling candle. Adds only `sha2`.
models = ["dep:sha2"]
# The opt-in pluggable-model tier (ADR-0003): a candle-backed BERT embedder and
# GGUF instruct generator. Pulls candle/tokenizers — none of which the default or
# plain `inference` builds contain. Builds on the shared `models` registry.
inference-local-models = [
    "inference",
    "models",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
]
# Ingest text from PDF documents into `meta.content` so inference embeds their
# meaning, not just the filename. Opt-in (off by default): pulls `pdf-extract`
# and its font/PDF-parsing tree. See ADR-0003-adjacent content-ingestion notes
# and [`crate::extract`].
pdf-text = ["dep:pdf-extract"]
# Ingest text from images via OCR into `meta.content` (ADR-0005 Tier A). Opt-in
# (off by default): pulls the pure-Rust `ocrs`/`rten` OCR tree. Reuses the shared
# `models` registry to fetch the OCR models with consent. See [`crate::extract`].
image-ocr = ["models", "dep:ocrs", "dep:rten", "dep:image"]
# Describe images via a local vision-language model (ADR-0005 Tier B). Opt-in
# (off by default): pulls candle (via `inference-local-models`) + `image`. When
# combined with `image-ocr`, OCR runs always and the VLM only on text-sparse
# images. See [`crate::extract`] and [`crate::localmodel::vision`].
image-vision = ["inference-local-models", "dep:image"]

[lints]
workspace = true
