[package]
name = "rto-graph"
description = "Provenance-tagged codebase knowledge graph store for Roteiro"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# Pure-Rust git access for content-addressed extraction (blob/tree ids, tree
# walking, worktree status). `sha1` selects the pure-Rust hashing backend; we
# stay off default features to avoid pulling any network transports (offline).
gix = { version = "0.86.0", default-features = false, features = [
    "sha1",
    "status",
    "dirwalk",
    "revision",
] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Parse TOML config files into config-key nodes during extraction (ADR-0009).
# Same crate the roteiro config loader uses; permissive, `cargo deny`-clean.
toml = "1.1"
tree-sitter = "0.26.12"
tree-sitter-tags = "0.26.12"
# tree-sitter 0.26's `QueryCursor::matches` yields a streaming iterator; needed to
# walk import-statement query matches for the per-language `imports` edges.
streaming-iterator = "0.1"
# Language grammars for the generic tags-query extractor. Each ships a `tags.scm`
# (surfacing `@definition.*` / `@reference.*`) that one shared extractor drives,
# so a new language is a table row, not new code. Grammars runtime-depend only on
# `tree-sitter-language`, so they never conflict with the core version. Rust keeps
# its dedicated AST walker (richer: imports, impl scoping); the rest go via tags.
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-php = "0.24.2"
tree-sitter-scala = "0.26.2"
tree-sitter-ocaml = "0.25.0"
tree-sitter-elixir = "0.3.5"
tree-sitter-bash = "0.25.1"
tree-sitter-sequel = "0.3.11"

# `models` only: SHA-256 verification for the registry/store.
sha2 = { version = "0.11", optional = true }

# `image-vision` only (ADR-0005 Tier B, ADR-0003 v1.1): image *understanding* via
# a GGUF vision-language model through the shared llama.cpp core (`rto-llama`) —
# no candle. Pure-Rust trait + types build without the C++ engine; the `llama`
# feature turns it on.
rto-llama = { workspace = true, optional = true }

# `pdf-text` only: pure-Rust PDF text extraction (fonts/CMaps handled internally).
# Opt-in — pulls a large tree (lopdf + font/crypto parsers) that the default and
# `inference*` builds never contain. Extraction is panic-guarded (see extract.rs).
pdf-extract = { version = "0.12", optional = true }

# `image-ocr` only (ADR-0005 Tier A): pure-Rust OCR. `ocrs` runs detection +
# recognition on `rten`, a pure-Rust model runtime (no ONNX Runtime / tesseract /
# C++ FFI). `image` is pinned to minimal codecs — its default features pull an
# AVIF → libfuzzer-sys (NCSA) chain that is not on the `cargo deny` allow-list.
ocrs = { version = "0.12", optional = true }
rten = { version = "0.24", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
yaml-rust2 = "0.11.0"

# `audio-metadata` only (ADR-0016): the *format* layer of a decoding library, used
# for a container read and nothing else — codec, rate, bit depth, channels,
# duration and tags — with no decoder ever instantiated. Pure safe Rust
# (`#![forbid(unsafe_code)]` upstream too): no FFI, no C toolchain, no model.
#
# `default-features = false` drops the SIMD/FFT optimisations (they only serve
# decoding, which we never do) and every container and codec we do not read. The
# enabled set is then exactly two groups:
#
# * `flac`, `mp3`, `wav` — the three containers `crate::media::is_audio` admits,
#   and no more. ADR-0016 explicitly declines to widen that set.
# * `id3v1`, `id3v2`, `ape` — the **standalone tag readers**. These are *not*
#   implied by `mp3`: with them off, `symphonia::default::get_probe()` registers
#   no metadata reader, and every ID3/APE tag on an MP3 is invisible while the
#   ADR promises to extract them. They add **no package** to the tree (all three
#   are feature flags on `symphonia-metadata`, which `flac` and `wav` already
#   pull), so honouring the ADR's tag list costs nothing but code size. FLAC's
#   Vorbis comments and WAV's RIFF INFO need no flag — they are embedded in
#   those containers and arrive with `flac`/`wav`.
#
# **MPL-2.0** — the licence ADR-0016 admits to `deny.toml`'s allow-list, with the
# reasoning recorded there. Pinned to an exact minor: upstream's bus factor is 1
# (ADR-0016, "Negative / costs"), so a version move should be a decision.
symphonia = { version = "0.6.1", default-features = false, features = [
    "flac",
    "mp3",
    "wav",
    "id3v1",
    "id3v2",
    "ape",
], optional = true }

[dev-dependencies]
# Also needed by the integration tests in `tests/`, which don't inherit the
# crate's normal dependencies.
serde_json = { workspace = true }

[features]
# Offline similarity inference (the `inferred` provenance class). Adds no
# dependencies — the default embedding is a pure-Rust hashing embedding
# (ADR-0003).
inference = []
# The shared, candle-free model machinery (ADR-0003): the registry, per-platform
# variants, the on-disk model store, and SHA-256 verification. Enabled by every
# model tier (embedding, generative, OCR) so they share one registry and the
# `roteiro model` commands without pulling candle. Adds only `sha2`.
models = ["dep:sha2"]
# Ingest text from PDF documents into `meta.content` so inference embeds their
# meaning, not just the filename. Opt-in (off by default): pulls `pdf-extract`
# and its font/PDF-parsing tree. See ADR-0003-adjacent content-ingestion notes
# and [`crate::extract`].
pdf-text = ["dep:pdf-extract"]
# Ingest text from images via OCR into `meta.content` (ADR-0005 Tier A). Opt-in
# (off by default): pulls the pure-Rust `ocrs`/`rten` OCR tree. Reuses the shared
# `models` registry to fetch the OCR models with consent. See [`crate::extract`].
image-ocr = ["models", "dep:ocrs", "dep:rten", "dep:image"]
# Describe images via a local GGUF vision-language model through llama.cpp
# (ADR-0005 Tier B; ADR-0003 v1.1 — no candle). Opt-in (off by default): pulls
# `rto-llama` (the C++ engine) + `image`. When combined with `image-ocr`, OCR
# runs always and the VLM only on text-sparse images. See [`crate::extract`].
image-vision = ["models", "dep:rto-llama", "rto-llama/llama", "dep:image"]
# Transcribe spoken-word audio (wav/mp3/flac) into `meta.content` via an
# audio-capable GGUF model through the shared llama.cpp `mtmd` core — the same
# path as `image-vision`, with an audio projector (Stage 18; no candle). Opt-in
# (off by default): pulls `rto-llama` (the C++ engine). Audio is decoded and
# resampled by llama.cpp's bundled miniaudio, so no extra audio-decoding crate is
# needed. See [`crate::extract`].
audio-transcribe = ["models", "dep:rto-llama", "rto-llama/llama"]
# Extract audio *metadata* — codec, sample rate, bit depth, channels, duration and
# tags — as `derived` facts, by reading the container with `symphonia` (ADR-0016).
# Opt-in (off by default) because it adds a dependency tree, but unlike every other
# media feature it needs **no model, no network and no C/C++ toolchain**: it is a
# format read, so its tests run everywhere CI does.
#
# Deliberately independent of `audio-transcribe` in both directions: that feature
# *generates* text about a blob (ADR-0015, and it lives in `crate::media`), this
# one *extracts* facts from it (ADR-0016, and it lives in the graph). Wiring
# either to imply the other would blur exactly the boundary the two ADRs draw.
# See [`crate::audio`].
audio-metadata = ["dep:symphonia"]

[lints]
workspace = true
