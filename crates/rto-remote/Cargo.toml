[package]
name = "rto-remote"
description = "The remote model tier's consent gate, payload allow-list and egress record (ADR-0019) — the policy half of Roteiro's one explicitly-consented egress path, with no transport of its own. Implementation detail of the roteiro CLI; no API stability guarantee."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# **There is deliberately no HTTP client here, and there must never be one.**
#
# ADR-0019 carves Roteiro's single exception to "nothing leaves the machine",
# and the thing that makes the exception checkable rather than merely promised
# is that the code holding the *policy* cannot perform the *act*. This crate
# assembles what may be sent, decides whether it may be sent, and records that
# it was — and takes the transport as a caller-supplied closure
# ([`crate::Transport`]), exactly as `rto-exec` takes its [`rto_exec::Fetcher`].
# The socket lives in the binary: `crates/roteiro/src/remote_transport.rs`,
# behind the off-by-default `remote` feature, one function reachable from one
# command. That file exists as of part 2 — so this crate now sits above code
# that really can send, which is exactly when the separation stops being
# theoretical and starts being the guarantee.
#
# Adding an HTTP client *here* is the change that would undo it, and it would
# not look like a mistake at review time: it would look like tidying the
# transport up next to the policy it serves. It is the opposite of that.
#
# The separation is also what lets every test here exercise the whole path
# without a network — in both directions, since `response` parses what comes
# back and has no socket to parse it from either — so a test cannot accidentally
# become the first thing that sends data.
[dependencies]
# Node identity and `meta`, which the payload allow-list reads *five named
# fields* out of (see `payload::ContextItem::from_node`). `rto-graph` is the
# crate that structurally cannot reach the network — its `gix` is pinned
# `default-features = false` to exclude the transports — so depending on it
# adds no transport here either.
rto-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
